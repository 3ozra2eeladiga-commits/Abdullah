<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Тайный покупатель</title>
<style>
:root{--bg:#eef1ea;--card:#fff;--txt:#1d2318;--mut:#6b7466;--cl:#ffffff;--bot:#dcf3c8;--acc:#5c6848;--bad:#c62828}
@media (prefers-color-scheme:dark){:root{--bg:#141712;--card:#1f241c;--txt:#e8ece4;--mut:#9aa394;--cl:#2a3026;--bot:#2f4a22;--acc:#a9b98f;--bad:#ff6b6b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 -apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:12px 16px 40px}
h1{font-size:20px;margin:6px 0 10px}.card{background:var(--card);border-radius:14px;padding:12px 14px;margin:10px 0;box-shadow:0 1px 3px #0001}
.bar{height:10px;background:#0001;border-radius:6px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--acc);transition:width .5s}
.mut{color:var(--mut);font-size:13px}.big{font-size:17px;font-weight:600}
.chat{display:flex;flex-direction:column;gap:6px;max-height:60vh;overflow-y:auto;padding:4px 0}
.b{max-width:85%;padding:7px 10px;border-radius:12px;white-space:pre-wrap;word-wrap:break-word;font-size:14px}
.c{align-self:flex-start;background:var(--cl);border:1px solid #0001}.o{align-self:flex-end;background:var(--bot)}
.s{align-self:center;color:var(--mut);font-size:12px;text-align:center;max-width:95%}
.p{color:var(--bad);margin:6px 0;cursor:pointer}.p b{margin-right:4px}
.run{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #0001;cursor:pointer}
.ok{color:#2e7d32}.no{color:var(--bad)}button{border:0;background:var(--acc);color:#fff;border-radius:10px;padding:8px 12px;font-size:14px}
</style></head><body><div class="wrap">
<h1>🕵️ Тайный покупатель</h1>
<div class="card"><div class="big" id="st">Загрузка…</div><div class="bar"><i id="pb" style="width:0"></i></div>
<div class="mut" id="sub"></div>
<div id="btns" style="display:none;margin-top:10px;gap:10px;display:none">
<button id="bstart" onclick="act('start')">▶️ Начать проверку</button>
<button id="bstop" onclick="act('stop')" style="background:#c62828">⏹ Стоп</button>
<span class="mut" id="msg"></span></div></div>
<div class="card"><div class="big" id="ct">Разговор</div><div class="mut" id="cs"></div><div class="chat" id="chat"></div>
<div id="back" style="display:none;margin-top:8px"><button onclick="sel=null;draw()">← к текущему разговору</button></div></div>
<div class="card"><div class="big">Найденные проблемы</div><div id="probs" class="mut">пока нет</div></div>
<div class="card"><div class="big">Разговоры</div><div id="runs" class="mut">пока нет</div></div>
<div class="mut">Это тестовые разговоры: отдельная база, клиентам и флористам ничего не уходит. Запуск — /qa в боте.</div>
</div>
<script>
let D=null,sel=null;const KEY=new URLSearchParams(location.search).get("key")||"";
async function act(w){msg.textContent=w=="start"?"запускаю…":"останавливаю… (докончит текущий ответ)";
 try{const r=await fetch("qa/"+w+"?key="+encodeURIComponent(KEY),{method:"POST"});
 if(r.status==403){msg.textContent="нет доступа — откройте ссылку из бота";return}
 const j=await r.json();if(w=="start"&&!j.ok)msg.textContent=j.running?"проверка уже идёт":"проверка выключена (чтобы не тратить деньги на ИИ)";}catch(e){msg.textContent="ошибка связи"}}
const esc=t=>String(t).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function bubbles(dl){return dl.map(([w,t])=>w=="client"?`<div class="b c">👤 ${esc(t)}</div>`:w=="bot"?`<div class="b o">${esc(t)}</div>`:`<div class="s">${esc(t)}</div>`).join("")}
function draw(){if(KEY){btns.style.display="flex";}if(!D)return;
 bstart.disabled=!!D.running;bstop.disabled=!D.running;bstart.style.opacity=D.running?.4:1;bstop.style.opacity=D.running?1:.4;
 const runs=D.runs||[];const done=runs.length,total=D.total||0;
 st.textContent=D.running?(D.loop?`🟢 Идёт проверка: разговор №${D.index}`:`🟢 Идёт проверка: ${D.index} из ${total}`):`Проверка закончена: ${done} разговоров`;
 pb.style.width=(D.loop?(D.running?((D.index%10)*10+5):100):total?Math.round(100*(D.running?D.index-1:done)/total):0)+"%";
 const np=runs.reduce((a,r)=>a+r.problems.length,0)+(D.running?(D.problems_now||[]).length:0);
 sub.textContent=(D.note?"⚠️ "+D.note+" · ":"")+`Заявок дошло: ${runs.filter(r=>r.order).length} · проблем: ${np} · ИИ: ${(D.usage||{}).calls||0} запросов, ~${Math.round(((D.usage||{}).chars||0)/3500)} тыс. токенов`;
 let r=sel!=null?runs[sel]:null;
 ct.textContent=r?r.title:(D.running?"Сейчас: "+D.title:"Последний разговор");
 const dl=r?r.dialog:(D.running?D.dialog:(runs.length?runs[runs.length-1].dialog:[]));
 const ch=document.getElementById("chat");const stick=ch.scrollTop+ch.clientHeight>=ch.scrollHeight-30;
 ch.innerHTML=bubbles(dl||[]);if(stick||r)ch.scrollTop=r?0:ch.scrollHeight;
 cs.innerHTML=r&&r.problems.length?r.problems.map(p=>`<div class="p">❗ ${esc(p[0])}</div>`).join(""):"";
 back.style.display=r?"block":"none";
 let n=0,ph="";runs.forEach((x,i)=>x.problems.forEach(p=>{n++;ph+=`<div class="p" onclick="sel=${i};draw();scrollTo(0,0)"><b>${n}.</b>${esc(p[0])}<div class="mut">${esc(x.title)} — ${esc(p[1]).slice(0,160)}</div></div>`}));
 probs.innerHTML=ph||"пока нет";
 runs_.innerHTML=runs.map((x,i)=>`<div class="run" onclick="sel=${i};draw();scrollTo(0,0)"><span>${esc(x.title)}</span><span class="${x.problems.length?"no":"ok"}">${x.order?"🧾":"—"} ${x.problems.length?"❗"+x.problems.length:"✅"}</span></div>`).reverse().join("")||"пока нет";
}
const runs_=document.getElementById("runs");
async function tick(){try{const r=await fetch("qa/live.json?"+Date.now());if(r.ok){D=await r.json();draw()}else{st.textContent="Проверок ещё не было"+(KEY?" — нажмите «Начать проверку»":" — отправьте /qa в боте");if(KEY){btns.style.display="flex";bstop.disabled=true;bstop.style.opacity=.4}}}catch(e){}
 setTimeout(tick,2500)}
tick();
</script></body></html>
