name: security-camera-windows
# Собирает «Умную камеру» в папку для Windows (свой Python внутри) и проверяет её на видео.
on:
  push:
    branches: [claude/new-session-o8b7ay]
    paths: ["security_camera/**", ".github/workflows/security-camera-windows.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Сборка папки
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pkg = "pkg"
          New-Item -ItemType Directory $pkg | Out-Null
          $ver = (python -c "import platform;print(platform.python_version())").Trim()
          Invoke-WebRequest "https://www.python.org/ftp/python/$ver/python-$ver-embed-amd64.zip" -OutFile py.zip
          Expand-Archive py.zip "$pkg/python"
          Set-Content "$pkg/python/python311._pth" "python311.zip`r`n.`r`nLib\site-packages`r`nimport site" -Encoding ascii
          python -m pip install --no-cache-dir --target "$pkg/python/Lib/site-packages" --extra-index-url https://download.pytorch.org/whl/cpu torch torchvision ultralytics opencv-python pillow lap
          Copy-Item security_camera/watch.py, security_camera/make_voice.py $pkg
          Copy-Item security_camera/samples $pkg -Recurse
          Copy-Item security_camera/windows/* $pkg
          python -m pip install edge-tts
          python "$pkg/make_voice.py"
          Push-Location $pkg
          ./python/python.exe -c "from ultralytics import YOLO; YOLO('yolo11s-pose.pt')"
          Pop-Location
          Get-ChildItem $pkg
      - name: Проверка на видео (встроенный Python)
        shell: pwsh
        run: |
          Push-Location pkg
          ./python/python.exe watch.py --source samples/kirill.mp4 --save ../test_out.mp4 --skip 2 2>&1 | Tee-Object ../test_log.txt
          Pop-Location
          if (-not (Select-String -Path test_log.txt -Pattern "тревог: [1-9]")) { throw "Тревога не сработала" }
          Remove-Item pkg/alerts -Recurse -ErrorAction SilentlyContinue
          Get-ChildItem -Path pkg -Recurse -Directory -Filter __pycache__ | Remove-Item -Recurse -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Umnaya-kamera-Windows
          path: pkg
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: proverka-video
          path: |
            test_out.mp4
            test_log.txt
