<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Pyatigorsk Student Guide</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a live 3D tactical map of the city (contour lines, km grid, outlined buildings) is the first screen; controls float on it; the guide reads below it. Single light theme (vintage shaded-relief paper map, Apple-style interface) by choice. */
:root{
  color-scheme:light;
  --night:#eef0f2; --deep:#eef0f2; --panel:#ffffff; --glass:rgba(255,255,255,.84); --line:rgba(20,24,31,.13);
  --fg:#14181f; --muted:#596273; --amber:#f08a24; --amber-t:#b24a0c; --coral:#ff7a66; --mint:#5fd6b4; --sky:#6db7ff; --violet:#b69cff;
  --display:"Unbounded","Manrope",system-ui,sans-serif; --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --gl:max(16px, env(safe-area-inset-left, 0px)); --gr:max(16px, env(safe-area-inset-right, 0px));
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{touch-action:pan-x pan-y;background:var(--night);color:var(--fg);font:15px/1.55 var(--body);margin:0}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* ---------- map hero ---------- */
.stage,.stage .pin,.stage .tools,.stage .headline{touch-action:none}
.stage .card{touch-action:pan-y}
.stage .chips{touch-action:pan-x}
.stage{position:relative;height:min(90vh,1300px);min-height:540px;overflow:hidden;background:var(--night)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl:active{cursor:grabbing}
.stage::before{content:"";position:absolute;inset:0 0 auto;height:150px;background:linear-gradient(var(--deep),transparent);pointer-events:none;z-index:2;opacity:.9;transition:opacity 1.4s}
.stage::after{content:"";position:absolute;inset:auto 0 0;height:150px;background:linear-gradient(transparent,var(--night));pointer-events:none;z-index:2;transition:opacity 1.4s}
#pins{position:absolute;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.pin{position:absolute;left:0;top:0;pointer-events:auto;display:flex;align-items:center;gap:6px;padding:0;border:0;background:none;white-space:nowrap;will-change:transform}
.pin i{width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px #fff,0 2px 8px rgba(10,16,26,.4);flex:none;transition:transform .15s}
.pin span{font:600 11.5px/1 var(--body);background:rgba(255,255,255,.95);border:1px solid var(--line);padding:5px 8px;border-radius:999px;display:none}
.pin.big i{width:15px;height:15px}
.pin.big span,.pin.show span,.pin:hover span,.pin.on span{display:block}
.pin:hover i,.pin.on i{transform:scale(1.45)}
.pin.on span{background:var(--c);color:#0a101a;border-color:transparent}
.pin.left{flex-direction:row-reverse;margin-left:0}
.pin.peak{pointer-events:none}
.pin.peak i{display:none}
.pin.peak span{display:block;background:none;border:0;font:700 10.5px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-shadow:0 1px 6px #fff}

.top{position:absolute;inset:0 0 auto;z-index:5;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px var(--gr) 0 var(--gl)}
.brand span,.nav a,.hint,.brand small{transition:color 1.2s}
.brand{font:600 13px/1.1 var(--display);letter-spacing:.02em;text-decoration:none;display:flex;flex-direction:column;gap:3px}
.brand small{font:500 10px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--amber-t)}
.cities{display:flex;gap:6px;flex-wrap:wrap}
.city{font:600 12px/1 var(--body);padding:7px 11px;border-radius:999px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.city[aria-current]{border-color:var(--amber-t);color:var(--amber-t)}
.city.soon{color:var(--muted)}
.city.soon em{font:500 9px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;font-style:normal;margin-left:5px;opacity:.8}
.grow{flex:1}
.nav{display:flex;gap:16px;font-weight:600;font-size:13px}
.nav a{text-decoration:none;color:var(--muted)}
.nav a:hover{color:var(--fg)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.lang button{border:0;background:none;padding:7px 11px;font:700 11px/1 var(--mono);color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--fg);color:var(--deep)}

.chips{position:absolute;z-index:5;left:0;right:0;top:66px;display:flex;gap:7px;overflow-x:auto;padding:4px var(--gr) 8px var(--gl);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:7px;font:600 12.5px/1 var(--body);padding:9px 13px;border-radius:999px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c,var(--fg))}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--deep);border-color:transparent}

.headline{position:absolute;z-index:4;left:var(--gl);bottom:58px;max-width:min(520px,calc(100% - 32px));pointer-events:none;transition:opacity .4s}
.headline h1{font:600 clamp(26px,4.6vw,46px)/1.08 var(--display);margin:0 0 10px;text-wrap:balance;text-shadow:0 1px 22px #fff;transition:color 1.2s,text-shadow 1.2s}
.headline p{margin:0;color:#3a4250;max-width:44ch;text-shadow:0 1px 10px #fff;transition:color 1.2s,text-shadow 1.2s}
.stage.intro .headline h1{color:#fff;text-shadow:0 2px 24px rgba(0,0,0,.6)}
.stage.intro .headline p{color:#dbe4f2;text-shadow:0 1px 10px #000}
.stage.intro::before,.stage.intro::after{opacity:0}
.stage.intro .brand span{color:#fff}.stage.intro .nav a,.stage.intro .hint{color:#c5cede}.stage.intro .brand small{color:#ffb347}
.stage.busy .headline{opacity:0}

.tools{position:absolute;z-index:5;right:var(--gr);bottom:64px;display:flex;flex-direction:column;gap:6px}
.tools button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font:600 17px/1 var(--body)}
.hint{position:absolute;z-index:4;right:var(--gr);bottom:22px;font:500 10.5px/1 var(--mono);letter-spacing:.06em;color:var(--muted);text-transform:uppercase}

.card{position:absolute;z-index:6;left:var(--gl);bottom:22px;width:min(380px,calc(100% - 32px));max-height:62%;overflow:auto;background:var(--glass);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 20px 60px rgba(20,30,50,.22)}
.card h2{font:600 17px/1.25 var(--display);margin:0 30px 2px 0}
.card .ru{font:500 12px/1.3 var(--mono);color:var(--muted);margin-bottom:10px}
.card p{margin:0 0 10px;color:#2c3340}
.card .x{position:absolute;right:10px;top:10px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(20,24,31,.07);font-size:16px}
.card .tag:not(.ghost),.flat .tag:not(.ghost){color:#fff;text-shadow:0 0 2px rgba(0,0,0,.35)}
.tag{display:inline-block;font:700 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:5px 8px;border-radius:6px;background:var(--c,var(--amber));color:#0a101a;margin:0 6px 10px 0}
.tag.ghost{background:none;border:1px solid var(--line);color:var(--muted)}
.facts{display:flex;gap:16px;flex-wrap:wrap;margin:0 0 12px;font:500 12px/1.3 var(--mono);color:var(--muted)}
.facts b{display:block;color:var(--fg);font-size:14px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;font:700 13px/1 var(--body);padding:11px 15px;border-radius:12px;border:1px solid var(--line);background:rgba(20,24,31,.045);text-decoration:none}
.btn.main{background:var(--amber);border-color:transparent;color:#1a1204}
.routes{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin:10px 0 12px}
.routes button{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:rgba(20,24,31,.045);font:700 15px/1 var(--mono)}
.routes button[aria-pressed="true"]{background:var(--c);color:#0a101a;border-color:transparent}
.stops{list-style:none;margin:10px 0 0;padding:0 0 0 14px;border-left:2px solid var(--c,var(--line));font-size:13px;max-height:170px;overflow:auto}
.stops li{padding:3px 0;color:var(--muted)}
.stops li.me{color:var(--amber-t);font-weight:700}
.verdict{padding:10px 12px;border-radius:12px;background:rgba(240,138,36,.14);border:1px solid rgba(240,138,36,.5);font-weight:600;font-size:13px}
.verdict.no{background:rgba(20,24,31,.04);border-color:var(--line);color:var(--muted)}
.loader{position:fixed;inset:0;z-index:100;overflow:hidden;color:#fff;background:linear-gradient(#0a1230 0%,#1b2f66 46%,#4a5fa8 78%,#f0a57a 100%);transition:opacity .9s,visibility .9s;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Helvetica Neue",Arial,sans-serif}
.loader.done{opacity:0;visibility:hidden;pointer-events:none}
.lsky i{position:absolute;border-radius:50%;background:rgba(255,255,255,.07);filter:blur(30px)}
.lsky i:nth-child(1){width:46vw;height:16vh;left:-8vw;top:22vh}.lsky i:nth-child(2){width:52vw;height:18vh;right:-10vw;top:40vh}.lsky i:nth-child(3){width:70vw;height:20vh;left:14vw;bottom:-6vh;background:rgba(255,200,160,.16)}
.lpath{position:absolute;inset:0;width:100%;height:100%}
.lplane{position:absolute;left:0;top:0;width:clamp(54px,7vw,96px);height:auto;margin:calc(clamp(54px,7vw,96px)*-.3) 0 0 calc(clamp(54px,7vw,96px)*-.5);filter:drop-shadow(0 6px 14px rgba(0,0,0,.35));will-change:transform;transition:transform .35s linear}
.ltext{position:absolute;left:max(24px,6vw);right:max(24px,6vw);bottom:max(40px,9vh);text-align:left}
.ltext small{display:block;font-weight:600;font-size:14px;line-height:1;letter-spacing:.02em;color:rgba(255,255,255,.7);margin-bottom:10px}
.ltext h1{font-weight:700;font-size:clamp(40px,7.4vw,104px);line-height:.98;letter-spacing:-.045em;margin:0}
.ltext p{font-weight:500;font-size:clamp(18px,2.6vw,30px);line-height:1.2;letter-spacing:-.02em;margin:10px 0 26px;color:rgba(255,255,255,.88)}
.lbar{height:3px;border-radius:3px;background:rgba(255,255,255,.22);max-width:420px;overflow:hidden}
.lbar u{display:block;height:100%;width:0;background:#fff;transition:width .3s}
.ltext b{display:block;margin-top:10px;font-weight:600;font-size:13px;line-height:1;font-variant-numeric:tabular-nums;color:rgba(255,255,255,.7)}
.ltext b::after{content:"%"}

/* ---------- guide below ---------- */
.wrap{max-width:2300px;margin:0 auto;padding-left:var(--gl);padding-right:var(--gr)}
section{padding-block:64px 8px}
.eyebrow{font:500 11px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--amber-t);margin-bottom:12px}
h2.t{font:600 clamp(22px,3.4vw,34px)/1.15 var(--display);margin:0 0 12px;text-wrap:balance}
.lead{color:var(--muted);max-width:65ch;margin:0 0 28px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.flat{box-shadow:0 6px 24px rgba(20,30,50,.06);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.flat h3{font:600 15px/1.3 var(--body);margin:0}
.flat .price{font:700 22px/1 var(--mono)}
.flat .price small{font:500 12px/1 var(--body);color:var(--muted)}
.flat ul{margin:0;padding:0;list-style:none;color:var(--muted);font-size:13px;display:grid;gap:4px}
.flat .acts{margin-top:auto}
.steps{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin:34px 0 0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;border-top:1px solid var(--line);padding-top:14px;color:var(--muted)}
.steps li::before{content:"0" counter(s);font:700 12px/1 var(--mono);color:var(--amber-t);display:block;margin-bottom:8px}
.steps b{display:block;color:var(--fg);margin-bottom:4px}
.note{border-left:2px solid var(--amber);padding:2px 0 2px 14px;color:var(--muted);max-width:65ch;margin-top:26px;font-size:13.5px}
.two{display:grid;gap:34px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));align-items:start}
.qa{display:grid;gap:0;margin:0}
.qa div{border-top:1px solid var(--line);padding:14px 0}
.qa dt{font-weight:700;margin-bottom:4px}
.qa dd{margin:0;color:var(--muted)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:14px}
th{font:500 10.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px 10px 0}
td{border-top:1px solid var(--line);padding:12px 12px 12px 0;vertical-align:middle}
td .no{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--c);color:#0a101a;font:700 15px/1 var(--mono)}
td .yes{color:var(--amber-t);font-weight:700}
td .dim{color:var(--muted)}
td button{border:1px solid var(--line);background:none;border-radius:9px;padding:7px 10px;font-weight:600;font-size:12.5px}
.days{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.day{border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.day .in{font:700 26px/1 var(--mono)}
.day .in small{font:500 11px/1 var(--mono);color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-left:6px}
.day .when{font:500 11.5px/1.3 var(--mono);color:var(--muted);margin:8px 0 6px}
.day b{display:block;margin-bottom:4px}
.day p{margin:0;color:var(--muted);font-size:13px}
.day{background:var(--panel)}
.day:first-child{background:linear-gradient(140deg,rgba(240,138,36,.2),#fff 70%);border-color:rgba(240,138,36,.55)}
.check{display:grid;gap:0;margin:0;padding:0;list-style:none}
.check li{border-top:1px solid var(--line);padding:13px 0;color:var(--muted)}
.check b{color:var(--fg)}
footer{margin-top:70px;border-top:1px solid var(--line);padding-block:26px 40px;color:var(--muted);font-size:12.5px}
footer .wrap{display:flex;gap:10px 30px;flex-wrap:wrap;justify-content:space-between}
@media (max-width:760px){
  .nav,.cities{display:none}
  .chips{top:58px}
  .stage{height:min(86vh,720px)}
  .headline{bottom:74px}
  .tools{bottom:auto;top:118px}
  .hint{display:none}
  .card{left:8px;right:8px;width:auto;bottom:8px;max-height:56%}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

/* ---- white plan with red accents (overrides the base above) ---- */
:root{color-scheme:light;--night:#f6f6f4;--deep:#f6f6f4;--panel:#ffffff;--glass:rgba(255,255,255,.9);--line:rgba(20,22,28,.13);--fg:#14161c;--muted:#666b76;--amber:#e5262b;--amber-t:#c81e23}
.stage{background:#0a1020}
#sky{position:absolute;inset:0;background:linear-gradient(#e4e7ea 0%,#f3f4f5 40%,#f3f4f5 100%)}
.stage::before{height:120px;background:linear-gradient(rgba(246,246,244,.8),transparent)}
.headline h1{color:#14161c;text-shadow:0 1px 0 #fff,0 0 26px #fff,0 0 12px #fff}
.headline h1::after{content:"";display:block;width:54px;height:6px;background:var(--amber);margin-top:14px}
.headline p{color:#2c3038;text-shadow:0 0 10px #fff,0 0 4px #fff;font-weight:600}
.city,.chip,.lang,.tools button{box-shadow:0 3px 12px rgba(20,22,28,.1)}
.flat,.day{box-shadow:0 6px 22px rgba(20,22,28,.06)}
.btn.main{color:#fff}
.day:first-child{background:linear-gradient(140deg,rgba(229,38,43,.12),#fff 70%);border-color:rgba(229,38,43,.4)}
.verdict{background:rgba(229,38,43,.08);border-color:rgba(229,38,43,.35)}
.pin i{width:13px;height:13px}
.subs{position:absolute;z-index:5;left:0;right:0;top:112px;display:flex;gap:6px;overflow-x:auto;padding:2px var(--gr) 6px var(--gl);scrollbar-width:none;touch-action:pan-x}
.subs::-webkit-scrollbar{display:none}
.subs button{flex:none;display:flex;align-items:center;gap:6px;font:600 11.5px/1 var(--body);padding:7px 10px;border-radius:999px;border:1px solid var(--line);background:var(--glass);color:var(--fg)}
.subs button::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.subs button[aria-pressed="true"]{background:var(--c);border-color:transparent}
.grid.row{display:flex;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:14px;margin-right:calc(-1*var(--gr));padding-right:var(--gr)}
.grid.row>.flat{flex:0 0 min(270px,78vw);scroll-snap-align:start}
.swipe{font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:-14px 0 14px}
@media (max-width:760px){.subs{top:104px}}
/* ---- final look: relief paper map + Apple-style interface (overrides the blocks above) ---- */

  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Helvetica Neue",Arial,sans-serif;--body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Helvetica Neue",Arial,sans-serif;--mono:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Helvetica Neue",Arial,sans-serif}

[data-v=r] .headline h1::after{display:none}

[data-v=r] .lead{font-size:17px;line-height:1.45}
[data-v=r] .eyebrow,[data-v=r] .swipe{font:600 12px/1 var(--body);letter-spacing:.02em;text-transform:none;color:var(--muted)}
[data-v=r] .eyebrow{color:#bf4800;font-size:14px}
[data-v=r] .brand span{font:700 19px/1 var(--display);letter-spacing:-.02em}
[data-v=r] .brand small{font:600 11px/1 var(--body);letter-spacing:.02em;text-transform:none;color:var(--muted)}
[data-v=r] .city,[data-v=r] .chip,[data-v=r] .lang,[data-v=r] .tools button,[data-v=r] .subs button{background:rgba(255,255,255,.72);backdrop-filter:saturate(1.8) blur(20px);-webkit-backdrop-filter:saturate(1.8) blur(20px);border:1px solid rgba(255,255,255,.6);box-shadow:0 2px 10px rgba(0,0,0,.1);border-radius:999px;color:#1d1d1f;font-family:var(--body);font-weight:600;text-transform:none;letter-spacing:-.01em}
[data-v=r] .chip{font-size:14px;padding:10px 15px}
[data-v=r] .tools button{border-radius:50%;width:42px;height:42px}
[data-v=r] .city.soon{color:#86868b}[data-v=r] .city.soon em{font:500 10px/1 var(--body);text-transform:none;letter-spacing:0}
[data-v=r] .city[aria-current]{color:#0071e3;border-color:rgba(0,113,227,.5)}
[data-v=r] .lang button{font:600 12px/1 var(--body);color:#6e6e73}
[data-v=r] .chip[aria-pressed="true"],[data-v=r] .lang button[aria-pressed="true"]{background:#1d1d1f;color:#fff;border-color:transparent}

    {k:'med',id:'m1',n:'City Hospital No. 1',fr:'Hôpital municipal n° 1',ru:'Городская больница № 1',at:[43.06586,44.04447],d:{en:'The main city hospital, closest to the campus. In an emergency call 103 (ambulance) or 112, both free from any phone. Take your passport and insurance policy.',fr:'Le principal hôpital de la ville, le plus proche du campus. En cas d’urgence, appelez le 103 (ambulance) ou le 112, gratuits depuis tout téléphone. Prenez votre passeport et votre assurance.',ru:'Главная городская больница, ближайшая к корпусу. В экстренном случае звоните 103 (скорая) или 112 — бесплатно с любого телефона. Возьмите паспорт и страховой полис.'}},

    {k:'med',id:'m3',n:'Infectious Diseases Hospital',fr:'Hôpital des maladies infectieuses',ru:'Инфекционная больница',at:[43.06556,44.06482],d:{en:'For high fever with rash, food poisoning, hepatitis and other infections. An ambulance brings patients here.',fr:'Pour forte fièvre avec éruption, intoxication alimentaire, hépatite et autres infections. L’ambulance y conduit les patients.',ru:'При высокой температуре с сыпью, отравлениях, гепатите и других инфекциях. Сюда привозит скорая.'}},
    {k:'med',id:'m4',n:'Ambulance station',fr:'Station d’ambulances',ru:'Станция скорой помощи',at:[43.05962,44.02395],d:{en:'You do not go here yourself: call 103 or 112 and the ambulance comes to you. The call and the ambulance are free.',fr:'On n’y va pas soi-même : appelez le 103 ou le 112 et l’ambulance vient à vous. L’appel et l’ambulance sont gratuits.',ru:'Сюда не нужно ехать самому: позвоните 103 или 112, скорая приедет к вам. Звонок и вызов бесплатные.'}},

    {k:'police',id:'p1',n:'City police department',fr:'Commissariat central',ru:'Отдел МВД по г. Пятигорску · ул. Рубина, 2',at:[43.07746,44.03571],d:{en:'Main police station of the city. Emergency number: 102 or 112. Always carry your passport, migration card and registration, or photos of them.',fr:'Commissariat principal de la ville. Numéro d’urgence : 102 ou 112. Ayez toujours sur vous passeport, carte migratoire et enregistrement, ou leurs photos.',ru:'Главный отдел полиции города. Экстренный номер: 102 или 112. Всегда носите паспорт, миграционную карту и регистрацию или их фото.'}},

    {k:'see',id:'s1',n:'Proval',fr:'Le Proval',ru:'Провал',at:[43.0987,44.0467],d:{en:'The symbol of the city: a 40 m deep cave in Mashuk with a turquoise sulphur lake at the bottom. You walk in through a tunnel. Free.',fr:'Le symbole de la ville : une grotte de 40 m dans le Machouk avec un lac sulfureux turquoise au fond. On y entre par un tunnel. Gratuit.',ru:'Символ города: пещера глубиной 40 м в Машуке с бирюзовым сероводородным озером. Вход через тоннель, бесплатно.'}},
    {k:'see',id:'s2',n:'Mashuk summit, 993 m',fr:'Sommet du Machouk, 993 m',ru:'Вершина Машука, 993 м',at:[43.0889,44.0500],d:{en:'View over the whole city, Beshtau and, on a clear day, Elbrus. TV tower and a viewing deck. Go up by cable car or on foot.',fr:'Vue sur toute la ville, le Bechtaou et, par temps clair, l’Elbrouz. Tour de télévision et plateforme panoramique. Montée en téléphérique ou à pied.',ru:'Вид на весь город, Бештау и в ясную погоду на Эльбрус. Телевышка и смотровая площадка. Подняться можно на канатке или пешком.'}},
    {k:'see',id:'s3',n:'Mashuk cable car',fr:'Téléphérique du Machouk',ru:'Канатная дорога на Машук',at:[43.08135,44.04368],d:{en:'Lower station on Gagarin Boulevard. The ride to the top takes about 3 minutes.',fr:'Station basse sur le boulevard Gagarine. La montée dure environ 3 minutes.',ru:'Нижняя станция на бульваре Гагарина. Подъём занимает около 3 минут.'}},
    {k:'see',id:'s4',n:'Aeolian Harp',fr:'La Harpe éolienne',ru:'Эолова арфа',at:[43.0883,44.0408],d:{en:'A stone pavilion from 1831 on the edge of a cliff. The best sunset view in the city.',fr:'Un pavillon de pierre de 1831 au bord d’une falaise. Le plus beau coucher de soleil de la ville.',ru:'Каменная беседка 1831 года на краю скалы. Лучший закат в городе.'}},
    {k:'see',id:'s5',n:'Academic Gallery',fr:'Galerie académique',ru:'Академическая галерея',at:[43.0880,44.0398],d:{en:'White gallery above the old town with a wide staircase and a view over the centre.',fr:'Galerie blanche au-dessus de la vieille ville avec un grand escalier et une vue sur le centre.',ru:'Белая галерея над старым городом, широкая лестница и вид на центр.'}},
    {k:'see',id:'s6',n:'Tsvetnik Park',fr:'Parc Tsvetnik',ru:'Парк «Цветник»',at:[43.08191,44.03679],d:{en:'The old resort centre: the Lermontov Gallery, Diana’s Grotto, fountains, evening walks.',fr:'Le vieux centre thermal : galerie Lermontov, grotte de Diane, fontaines, promenades du soir.',ru:'Старый курортный центр: Лермонтовская галерея, грот Дианы, фонтаны, вечерние прогулки.'}},
    {k:'see',id:'s7',n:'Eagle sculpture',fr:'Sculpture de l’Aigle',ru:'Скульптура «Орёл»',at:[43.0834,44.0373],d:{en:'A bronze eagle fighting a snake, the emblem of the Caucasus spa towns. Everyone takes a photo here.',fr:'Un aigle de bronze luttant contre un serpent, emblème des villes thermales du Caucase. Tout le monde s’y prend en photo.',ru:'Бронзовый орёл со змеёй — эмблема Кавказских Минеральных Вод. Здесь фотографируются все.'}},
    {k:'see',id:'s8',n:'Chinese Pavilion',fr:'Pavillon chinois',ru:'Китайская беседка',at:[43.0830,44.0355],d:{en:'Colourful pavilion on Goryachaya hill with a view of the city and the mountains.',fr:'Pavillon coloré sur la colline Goriatchaïa avec vue sur la ville et les montagnes.',ru:'Яркая беседка на горе Горячей с видом на город и горы.'}},
    {k:'see',id:'s9',n:'Lermontov’s Grotto',fr:'Grotte de Lermontov',ru:'Грот Лермонтова',at:[43.0871,44.0399],d:{en:'A small cave in the rock where the poet Lermontov liked to sit.',fr:'Une petite grotte dans la roche où le poète Lermontov aimait s’asseoir.',ru:'Небольшой грот в скале, где любил бывать Лермонтов.'}},
    {k:'see',id:'s10',n:'Lermontov duel site',fr:'Lieu du duel de Lermontov',ru:'Место дуэли Лермонтова',at:[43.0772,44.0590],d:{en:'Monument in the forest on the slope of Mashuk where the poet was killed in a duel in 1841.',fr:'Monument dans la forêt, sur la pente du Machouk, où le poète fut tué en duel en 1841.',ru:'Памятник в лесу на склоне Машука, где поэт погиб на дуэли в 1841 году.'}},
    {k:'see',id:'s11',n:'Lermontov House Museum',fr:'Maison-musée de Lermontov',ru:'Домик Лермонтова',at:[43.0778,44.0399],d:{en:'The small house where Lermontov spent his last months.',fr:'La petite maison où Lermontov passa ses derniers mois.',ru:'Домик, где Лермонтов прожил последние месяцы.'}},
    {k:'see',id:'s12',n:'Gates of Love',fr:'Portes de l’amour',ru:'Ворота любви',at:[43.0775,44.0500],d:{en:'Stone arch on the slope of Mashuk. Couples walk through it holding hands.',fr:'Arche de pierre sur la pente du Machouk. Les couples la traversent main dans la main.',ru:'Каменная арка на склоне Машука. Пары проходят через неё, держась за руки.'}},
    {k:'see',id:'s13',n:'Singing Fountain',fr:'Fontaine musicale',ru:'Поющий фонтан',at:[43.0719,44.0400],d:{en:'Light and music fountain on Lenin Square in the warm season, in the evening.',fr:'Fontaine musicale et lumineuse place Lénine, le soir à la belle saison.',ru:'Светомузыкальный фонтан на площади Ленина, вечером в тёплый сезон.'}},
    {k:'see',id:'s14',n:'Kirov Park',fr:'Parc Kirov',ru:'Парк им. Кирова',at:[43.06182,44.03275],d:{en:'Lake with boats, rides, a stadium.',fr:'Lac avec barques, manèges, stade.',ru:'Озеро с лодками, аттракционы, стадион.'}},

    {k:'hike',id:'h1',n:'Mashuk ring trail',fr:'Sentier autour du Machouk',ru:'Терренкур вокруг Машука',at:[43.0965,44.0574],d:{en:'An easy flat walk around the whole mountain through the forest: about 10 km, 2.5 to 3 hours. Passes Proval, the duel site and the Gates of Love. Good for a first weekend.',fr:'Une promenade facile et plate autour de toute la montagne, en forêt : environ 10 km, 2 h 30 à 3 h. Passe par le Proval, le lieu du duel et les Portes de l’amour. Idéal pour un premier week-end.',ru:'Лёгкая ровная прогулка вокруг всей горы по лесу: около 10 км, 2,5–3 часа. Проходит мимо Провала, места дуэли и Ворот любви. Хорошо для первых выходных.'}},
    {k:'hike',id:'h2',n:'Walk up to Mashuk summit',fr:'Montée à pied au Machouk',ru:'Пеший подъём на Машук',at:[43.0883,44.0462],d:{en:'A forest trail from the ring path to the top, 993 m. About 1.5 hours up. Take water and normal shoes; ride the cable car down if you are tired.',fr:'Un sentier forestier du chemin circulaire jusqu’au sommet, 993 m. Environ 1 h 30 de montée. Prenez de l’eau et de bonnes chaussures ; redescendez en téléphérique si vous êtes fatigué.',ru:'Лесная тропа от терренкура до вершины, 993 м. Подъём около 1,5 часа. Возьмите воду и нормальную обувь; вниз можно на канатке.'}},
    {k:'hike',id:'h3',n:'Mount Kazachka viewpoint',fr:'Belvédère du mont Kazatchka',ru:'Гора Казачка',at:[43.0774,44.0460],d:{en:'A short climb close to the centre with a view over the city.',fr:'Une courte montée près du centre avec vue sur la ville.',ru:'Короткий подъём рядом с центром, вид на город.'}},
    {k:'hike',id:'h4',n:'Mount Beshtau, 1400 m',fr:'Mont Bechtaou, 1400 m',ru:'Гора Бештау, 1400 м',at:[43.0221,44.0981],d:{en:'The five-peaked mountain you see from the dorms. A full-day hike for a group; in May the slopes are covered with wild poppies. Do not go alone or in bad weather.',fr:'La montagne à cinq sommets que l’on voit depuis les résidences. Une randonnée d’une journée, en groupe ; en mai, les pentes sont couvertes de coquelicots. N’y allez pas seul ni par mauvais temps.',ru:'Пятиглавая гора, которую видно из общежитий. Поход на целый день для компании; в мае склоны в маках. Не ходите в одиночку и в плохую погоду.'}},
    {k:'hike',id:'h5',n:'Monastery Lake on Beshtau',fr:'Lac du monastère, Bechtaou',ru:'Монастырское озеро',at:[43.0102,44.0849],d:{en:'A quiet forest lake near the monastery on the slope of Beshtau.',fr:'Un lac forestier paisible près du monastère, sur la pente du Bechtaou.',ru:'Тихое лесное озеро у монастыря на склоне Бештау.'}},

    {k:'spring',id:'w1',n:'“Shameless” hot pools',fr:'Bains chauds « sans pudeur »',ru:'Бесстыжие ванны',at:[43.0929,44.0402],d:{en:'Free open-air pools with warm sulphur water on the slope of Mashuk. Locals bathe here all year. Bring a towel; the smell of sulphur is normal.',fr:'Bassins gratuits en plein air d’eau sulfureuse chaude sur la pente du Machouk. Les habitants s’y baignent toute l’année. Prenez une serviette ; l’odeur de soufre est normale.',ru:'Бесплатные открытые ванны с тёплой сероводородной водой на склоне Машука. Местные купаются круглый год. Возьмите полотенце; запах серы — это нормально.'}},
    {k:'spring',id:'w2',n:'Pump room No. 7, warm narzan',fr:'Buvette n° 7, narzan chaud',ru:'Бювет источника № 7 (тёплый нарзан)',at:[43.0816,44.0429],d:{en:'Drink warm mineral water straight from the spring. Bring your own cup.',fr:'Buvez l’eau minérale chaude directement à la source. Apportez votre gobelet.',ru:'Тёплая минеральная вода прямо из источника. Возьмите свой стакан.'}},
    {k:'spring',id:'w3',n:'Pump rooms No. 2 and No. 17',fr:'Buvettes n° 2 et n° 17',ru:'Бюветы источников № 2 и № 17',at:[43.0821,44.0375],d:{en:'Drinking springs in Tsvetnik Park, in the old resort centre.',fr:'Sources d’eau potable dans le parc Tsvetnik, au vieux centre thermal.',ru:'Питьевые источники в парке «Цветник», в старом курортном центре.'}},
    {k:'spring',id:'w4',n:'Mikhailovsky spring',fr:'Source Mikhaïlovski',ru:'Михайловский источник',at:[43.0888,44.0406],d:{en:'A historic spring by the Mikhailovskaya Gallery, next to the Aeolian Harp.',fr:'Une source historique près de la galerie Mikhaïlovskaïa, à côté de la Harpe éolienne.',ru:'Исторический источник у Михайловской галереи, рядом с Эоловой арфой.'}},
    {k:'spring',id:'w5',n:'Lermontov Baths',fr:'Bains Lermontov',ru:'Лермонтовские ванны',at:[43.0824,44.0366],d:{en:'The oldest bathhouse in the city, 1831. Mineral baths are still given here.',fr:'Le plus ancien établissement de bains de la ville, 1831. On y prend encore des bains minéraux.',ru:'Старейшее здание ванн в городе, 1831 год. Минеральные ванны принимают до сих пор.'}},
    {k:'spring',id:'w6',n:'Pirogov Baths',fr:'Bains Pirogov',ru:'Пироговские ванны',at:[43.0921,44.0407],d:{en:'Sulphur baths on the slope of Mashuk.',fr:'Bains sulfureux sur la pente du Machouk.',ru:'Сероводородные ванны на склоне Машука.'}}

rgLead:{en:'Rules change. Always confirm the current deadline with the PMPI international office before you move.',fr:'Les règles changent. Confirmez toujours le délai actuel auprès du bureau international du PMPI avant de déménager.',ru:'Правила меняются. Перед переездом уточняйте актуальные сроки в международном отделе ПМФИ.'},
rg:{en:[['What is it?','Migration registration is a paper that says at which address you stay in Russia. You need it together with your passport, visa and migration card.'],['Who does it?','Not you. The host does: the university if you live in a dorm, the owner if you rent a flat.'],['When?','Within 7 working days after you arrive or move to a new address.'],['Why is it hard to rent?','Many owners do not want to file papers for a foreign tenant. Without registration you risk a fine and problems with your visa.']],
fr:[['Qu’est-ce que c’est ?','L’enregistrement migratoire est un document indiquant à quelle adresse vous séjournez en Russie. Il accompagne votre passeport, votre visa et votre carte migratoire.'],['Qui le fait ?','Pas vous. C’est l’hôte : l’université si vous êtes en résidence, le propriétaire si vous louez.'],['Quand ?','Dans les 7 jours ouvrables après votre arrivée ou votre déménagement.'],['Pourquoi est-ce difficile de louer ?','Beaucoup de propriétaires ne veulent pas faire les démarches pour un locataire étranger. Sans enregistrement, vous risquez une amende et des problèmes de visa.']],
ru:[['Что это?','Миграционный учёт — документ о том, по какому адресу вы находитесь в России. Нужен вместе с паспортом, визой и миграционной картой.'],['Кто оформляет?','Не вы, а принимающая сторона: вуз, если вы в общежитии, или хозяин квартиры, если снимаете.'],['Когда?','В течение 7 рабочих дней после приезда или переезда на новый адрес.'],['Почему трудно снять?','Многие хозяева не хотят оформлять документы на иностранца. Без регистрации — штраф и проблемы с визой.']]},

seLead:{en:'Pyatigorsk is a 200-year-old spa town built around Mount Mashuk. Almost everything here is free and within an hour on foot or a short tram ride from the dorms.',fr:'Piatigorsk est une ville thermale de 200 ans construite autour du mont Machouk. Presque tout y est gratuit et à moins d’une heure à pied ou à quelques arrêts de tram des résidences.',ru:'Пятигорск — курорт с двухсотлетней историей вокруг горы Машук. Почти всё здесь бесплатно и в часе пешком или в нескольких остановках на трамвае от общежитий.'},

fi:{en:[['Keep your migration card.','You get it at the border. Without it nobody can register you.'],['Get registered.','Give your passport and migration card to the dorm office or to your landlord in the first days.'],['Buy a SIM card.','Beeline, MTS or MegaFon, with your passport. There is a Beeline shop by the Universam tram stop.'],['Open a bank card.','Foreign Visa and Mastercard do not work in Russia. Open a Mir card at Sberbank next to the campus.'],['Install the apps.','Yandex Maps and 2GIS for routes, Yandex Go for taxis, Yandex Translate with the camera for signs.'],['Learn your stop.','Universam (Универсам). Trams 2, 4, 6, 7 and 8.']],
fr:[['Gardez votre carte migratoire.','Vous la recevez à la frontière. Sans elle, personne ne peut vous enregistrer.'],['Faites-vous enregistrer.','Remettez passeport et carte migratoire à la résidence ou à votre propriétaire dès les premiers jours.'],['Achetez une carte SIM.','Beeline, MTS ou MegaFon, avec votre passeport. Une boutique Beeline se trouve près de l’arrêt Universam.'],['Ouvrez une carte bancaire.','Les cartes Visa et Mastercard étrangères ne fonctionnent pas en Russie. Ouvrez une carte Mir à la Sberbank près du campus.'],['Installez les applications.','Yandex Maps et 2GIS pour les trajets, Yandex Go pour le taxi, Yandex Translate avec la caméra pour les panneaux.'],['Retenez votre arrêt.','Universam (Универсам). Trams 2, 4, 6, 7 et 8.']],
ru:[['Сохраните миграционную карту.','Её дают на границе. Без неё вас не зарегистрируют.'],['Оформите регистрацию.','В первые дни отдайте паспорт и миграционную карту в общежитие или хозяину квартиры.'],['Купите SIM-карту.','Билайн, МТС или МегаФон, по паспорту. Салон Билайн — у остановки «Универсам».'],['Оформите банковскую карту.','Иностранные Visa и Mastercard в России не работают. Карту «Мир» можно открыть в Сбербанке рядом с корпусом.'],['Установите приложения.','Яндекс Карты и 2ГИС — маршруты, Яндекс Go — такси, Яндекс Переводчик с камерой — вывески.'],['Запомните остановку.','«Универсам». Трамваи 2, 4, 6, 7 и 8.']]},
