<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Pyatigorsk Student Guide</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a live 3D tactical map of the city (contour lines, km grid, outlined buildings) is the first screen; controls float on it; the guide reads below it. Single light theme (vintage shaded-relief paper map, Apple-style interface) by choice. */
:root{
  color-scheme:light;
  --night:#eef0f2; --deep:#eef0f2; --panel:#ffffff; --glass:rgba(255,255,255,.84); --line:rgba(20,24,31,.13);
  --fg:#14181f; --muted:#596273; --amber:#f08a24; --amber-t:#b24a0c; --coral:#ff7a66; --mint:#5fd6b4; --sky:#6db7ff; --violet:#b69cff;
  --display:"Unbounded","Manrope",system-ui,sans-serif; --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --gl:max(16px, env(safe-area-inset-left, 0px)); --gr:max(16px, env(safe-area-inset-right, 0px));
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{touch-action:pan-x pan-y;background:var(--night);color:var(--fg);font:15px/1.55 var(--body);margin:0}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* ---------- map hero ---------- */
.stage,.stage .pin,.stage .tools,.stage .headline{touch-action:none}
.stage .card{touch-action:pan-y}
.stage .chips{touch-action:pan-x}
.stage{position:relative;height:min(90vh,1300px);min-height:540px;overflow:hidden;background:var(--night)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl:active{cursor:grabbing}
.stage::before{content:"";position:absolute;inset:0 0 auto;height:150px;background:linear-gradient(var(--deep),transparent);pointer-events:none;z-index:2;opacity:.9;transition:opacity 1.4s}
.stage::after{content:"";position:absolute;inset:auto 0 0;height:150px;background:linear-gradient(transparent,var(--night));pointer-events:none;z-index:2;transition:opacity 1.4s}
#pins{position:absolute;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.pin{position:absolute;left:0;top:0;pointer-events:auto;display:flex;align-items:center;gap:6px;padding:0;border:0;background:none;white-space:nowrap;will-change:transform}
.pin i{width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px #fff,0 2px 8px rgba(10,16,26,.4);flex:none;transition:transform .15s}
.pin span{font:600 11.5px/1 var(--body);background:rgba(255,255,255,.95);border:1px solid var(--line);padding:5px 8px;border-radius:999px;display:none}
.pin.big i{width:15px;height:15px}
.pin.big span,.pin.show span,.pin:hover span,.pin.on span{display:block}
.pin:hover i,.pin.on i{transform:scale(1.45)}
.pin.on span{background:var(--c);color:#0a101a;border-color:transparent}
.pin.left{flex-direction:row-reverse;margin-left:0}
.pin.peak{pointer-events:none}
.pin.peak i{display:none}
.pin.peak span{display:block;background:none;border:0;font:700 10.5px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-shadow:0 1px 6px #fff}

.top{position:absolute;inset:0 0 auto;z-index:5;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px var(--gr) 0 var(--gl)}
.brand span,.nav a,.hint,.brand small{transition:color 1.2s}
.brand{font:600 13px/1.1 var(--display);letter-spacing:.02em;text-decoration:none;display:flex;flex-direction:column;gap:3px}
.brand small{font:500 10px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--amber-t)}
.cities{display:flex;gap:6px;flex-wrap:wrap}
.city{font:600 12px/1 var(--body);padding:7px 11px;border-radius:999px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.city[aria-current]{border-color:var(--amber-t);color:var(--amber-t)}
.city.soon{color:var(--muted)}
.city.soon em{font:500 9px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;font-style:normal;margin-left:5px;opacity:.8}
.grow{flex:1}
.nav{display:flex;gap:16px;font-weight:600;font-size:13px}
.nav a{text-decoration:none;color:var(--muted)}
.nav a:hover{color:var(--fg)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.lang button{border:0;background:none;padding:7px 11px;font:700 11px/1 var(--mono);color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--fg);color:var(--deep)}

.chips{position:absolute;z-index:5;left:0;right:0;top:66px;display:flex;gap:7px;overflow-x:auto;padding:4px var(--gr) 8px var(--gl);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:7px;font:600 12.5px/1 var(--body);padding:9px 13px;border-radius:999px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c,var(--fg))}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--deep);border-color:transparent}

.headline{position:absolute;z-index:4;left:var(--gl);bottom:58px;max-width:min(520px,calc(100% - 32px));pointer-events:none;transition:opacity .4s}
.headline h1{font:600 clamp(26px,4.6vw,46px)/1.08 var(--display);margin:0 0 10px;text-wrap:balance;text-shadow:0 1px 22px #fff;transition:color 1.2s,text-shadow 1.2s}
.headline p{margin:0;color:#3a4250;max-width:44ch;text-shadow:0 1px 10px #fff;transition:color 1.2s,text-shadow 1.2s}
.stage.intro .headline h1{color:#fff;text-shadow:0 2px 24px rgba(0,0,0,.6)}
.stage.intro .headline p{color:#dbe4f2;text-shadow:0 1px 10px #000}
.stage.intro::before,.stage.intro::after{opacity:0}
.stage.intro .brand span{color:#fff}.stage.intro .nav a,.stage.intro .hint{color:#c5cede}.stage.intro .brand small{color:#ffb347}
.stage.busy .headline{opacity:0}

.tools{position:absolute;z-index:5;right:var(--gr);bottom:64px;display:flex;flex-direction:column;gap:6px}
.tools button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font:600 17px/1 var(--body)}
.hint{position:absolute;z-index:4;right:var(--gr);bottom:22px;font:500 10.5px/1 var(--mono);letter-spacing:.06em;color:var(--muted);text-transform:uppercase}

.card{position:absolute;z-index:6;left:var(--gl);bottom:22px;width:min(380px,calc(100% - 32px));max-height:62%;overflow:auto;background:var(--glass);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 20px 60px rgba(20,30,50,.22)}
.card h2{font:600 17px/1.25 var(--display);margin:0 30px 2px 0}
.card .ru{font:500 12px/1.3 var(--mono);color:var(--muted);margin-bottom:10px}
.card .tels{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.card .tels .btn{user-select:all;-webkit-user-select:all}
.card .addr{font:600 13.5px/1.35 var(--body);color:#1d1d1f;margin:-4px 0 10px}
.card .addr small{display:block;font-weight:500;font-size:12px;color:#6e6e73;margin-left:22px}
.card p{margin:0 0 10px;color:#2c3340}
.card .x{position:absolute;right:10px;top:10px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(20,24,31,.07);font-size:16px}
.card .tag:not(.ghost),.flat .tag:not(.ghost){color:#fff;text-shadow:0 0 2px rgba(0,0,0,.35)}
.tag{display:inline-block;font:700 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:5px 8px;border-radius:6px;background:var(--c,var(--amber));color:#0a101a;margin:0 6px 10px 0}
.tag.ghost{background:none;border:1px solid var(--line);color:var(--muted)}
.facts{display:flex;gap:16px;flex-wrap:wrap;margin:0 0 12px;font:500 12px/1.3 var(--mono);color:var(--muted)}
.facts b{display:block;color:var(--fg);font-size:14px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;font:700 13px/1 var(--body);padding:11px 15px;border-radius:12px;border:1px solid var(--line);background:rgba(20,24,31,.045);text-decoration:none}
.btn.main{background:var(--amber);border-color:transparent;color:#1a1204}
.routes{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin:10px 0 12px}
.routes button{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:rgba(20,24,31,.045);font:700 15px/1 var(--mono)}
.routes button[aria-pressed="true"]{background:var(--c);color:#0a101a;border-color:transparent}
.stops{list-style:none;margin:10px 0 0;padding:0 0 0 14px;border-left:2px solid var(--c,var(--line));font-size:13px;max-height:170px;overflow:auto}
.stops li{padding:3px 0;color:var(--muted)}
.stops li.me{color:var(--amber-t);font-weight:700}
.verdict{padding:10px 12px;border-radius:12px;background:rgba(240,138,36,.14);border:1px solid rgba(240,138,36,.5);font-weight:600;font-size:13px}
.verdict.no{background:rgba(20,24,31,.04);border-color:var(--line);color:var(--muted)}
.loader{position:fixed;inset:0;z-index:100;overflow:hidden;color:#fff;background:linear-gradient(#0a1230 0%,#1b2f66 46%,#4a5fa8 78%,#f0a57a 100%);transition:opacity .9s,visibility .9s;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Helvetica Neue",Arial,sans-serif}
.loader.done{opacity:0;visibility:hidden;pointer-events:none}
.lsky i{position:absolute;border-radius:50%;background:rgba(255,255,255,.07);filter:blur(30px)}
.lsky i:nth-child(1){width:46vw;height:16vh;left:-8vw;top:22vh}.lsky i:nth-child(2){width:52vw;height:18vh;right:-10vw;top:40vh}.lsky i:nth-child(3){width:70vw;height:20vh;left:14vw;bottom:-6vh;background:rgba(255,200,160,.16)}
.lmagic{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.lplane{z-index:2}
.lpath{position:absolute;inset:0;width:100%;height:100%}
.lplane{position:absolute;left:0;top:0;width:clamp(54px,7vw,96px);height:auto;margin:calc(clamp(54px,7vw,96px)*-.3) 0 0 calc(clamp(54px,7vw,96px)*-.5);filter:drop-shadow(0 6px 14px rgba(0,0,0,.35));will-change:transform;transition:transform .35s linear}
.ltext{position:absolute;left:max(24px,6vw);right:max(24px,6vw);bottom:max(40px,9vh);text-align:left}
.ltext small{display:block;font-weight:600;font-size:14px;line-height:1;letter-spacing:.02em;color:rgba(255,255,255,.7);margin-bottom:10px}
.ltext h1{font-weight:700;font-size:clamp(40px,7.4vw,104px);line-height:.98;letter-spacing:-.045em;margin:0}
.ltext p{font-weight:500;font-size:clamp(18px,2.6vw,30px);line-height:1.2;letter-spacing:-.02em;margin:10px 0 26px;color:rgba(255,255,255,.88)}
.lbar{height:3px;border-radius:3px;background:rgba(255,255,255,.22);max-width:420px;overflow:hidden}
.lbar u{display:block;height:100%;width:0;background:#fff;transition:width .3s}
.ltext b{display:block;margin-top:10px;font-weight:600;font-size:13px;line-height:1;font-variant-numeric:tabular-nums;color:rgba(255,255,255,.7)}
.ltext b::after{content:"%"}

/* ---------- guide below ---------- */
.wrap{max-width:2300px;margin:0 auto;padding-left:var(--gl);padding-right:var(--gr)}
section{padding-block:64px 8px}
.eyebrow{font:500 11px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--amber-t);margin-bottom:12px}
h2.t{font:600 clamp(22px,3.4vw,34px)/1.15 var(--display);margin:0 0 12px;text-wrap:balance}
.lead{color:var(--muted);max-width:65ch;margin:0 0 28px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.flat{box-shadow:0 6px 24px rgba(20,30,50,.06);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.flat h3{font:600 15px/1.3 var(--body);margin:0}
.flat .price{font:700 22px/1 var(--mono)}
.flat .price small{font:500 12px/1 var(--body);color:var(--muted)}
.flat ul{margin:0;padding:0;list-style:none;color:var(--muted);font-size:13px;display:grid;gap:4px}
.flat .acts{margin-top:auto}
.steps{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin:34px 0 0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;border-top:1px solid var(--line);padding-top:14px;color:var(--muted)}
.steps li::before{content:"0" counter(s);font:700 12px/1 var(--mono);color:var(--amber-t);display:block;margin-bottom:8px}
.steps b{display:block;color:var(--fg);margin-bottom:4px}
.note{border-left:2px solid var(--amber);padding:2px 0 2px 14px;color:var(--muted);max-width:65ch;margin-top:26px;font-size:13.5px}
.two{display:grid;gap:34px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));align-items:start}
.qa{display:grid;gap:0;margin:0}
.qa div{border-top:1px solid var(--line);padding:14px 0}
.qa dt{font-weight:700;margin-bottom:4px}
.qa dd{margin:0;color:var(--muted)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:14px}
th{font:500 10.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px 10px 0}
td{border-top:1px solid var(--line);padding:12px 12px 12px 0;vertical-align:middle}
td .no{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--c);color:#0a101a;font:700 15px/1 var(--mono)}
td .yes{color:var(--amber-t);font-weight:700}
td .dim{color:var(--muted)}
td button{border:1px solid var(--line);background:none;border-radius:9px;padding:7px 10px;font-weight:600;font-size:12.5px}
.days{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.day{border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.day .in{font:700 26px/1 var(--mono)}
.day .in small{font:500 11px/1 var(--mono);color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-left:6px}
.day .when{font:500 11.5px/1.3 var(--mono);color:var(--muted);margin:8px 0 6px}
.day b{display:block;margin-bottom:4px}
.day p{margin:0;color:var(--muted);font-size:13px}
.day{background:var(--panel)}
.day .dimg{display:block;width:calc(100% + 32px);max-width:none;margin:-16px -16px 14px;aspect-ratio:3/2;object-fit:cover;border-radius:16px 16px 0 0}
[data-v=r] .day .dimg{border-radius:22px 22px 0 0}
[data-v=r] .day:first-child{background:#fff;color:inherit}[data-v=r] .day:first-child .when,[data-v=r] .day:first-child p,[data-v=r] .day:first-child .in small{color:var(--muted)}
.day:first-child{box-shadow:0 0 0 2px #ff9500,0 6px 22px rgba(0,0,0,.08)!important}
.day:first-child{background:linear-gradient(140deg,rgba(240,138,36,.2),#fff 70%);border-color:rgba(240,138,36,.55)}
.check{display:grid;gap:0;margin:0;padding:0;list-style:none}
.check li{border-top:1px solid var(--line);padding:13px 0;color:var(--muted)}
.check b{color:var(--fg);display:block;font-size:16px;margin-bottom:4px}
.check span{display:block;line-height:1.5}
.check li:nth-child(-n+2){background:#fff4f3;border-radius:16px;padding:14px 16px;border-top:0;margin-bottom:8px}
.check li:nth-child(-n+2) b{color:#d70015}
footer{margin-top:70px;border-top:1px solid var(--line);padding-block:26px 40px;color:var(--muted);font-size:12.5px}
footer .wrap{display:flex;gap:10px 30px;flex-wrap:wrap;justify-content:space-between}
@media (max-width:760px){
  .nav,.cities{display:none}
  .chips{top:58px}
  .stage{height:min(86vh,720px)}
  .headline{bottom:74px}
  .tools{bottom:auto;top:118px}
  .hint{display:none}
  .card{left:8px;right:8px;width:auto;bottom:8px;max-height:56%}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

/* ---- white plan with red accents (overrides the base above) ---- */
:root{color-scheme:light;--night:#f6f6f4;--deep:#f6f6f4;--panel:#ffffff;--glass:rgba(255,255,255,.9);--line:rgba(20,22,28,.13);--fg:#14161c;--muted:#666b76;--amber:#e5262b;--amber-t:#c81e23}
.stage{background:#0a1020}
#sky{position:absolute;inset:0;background:linear-gradient(#e4e7ea 0%,#f3f4f5 40%,#f3f4f5 100%)}
.stage::before{height:120px;background:linear-gradient(rgba(246,246,244,.8),transparent)}
.headline h1{color:#14161c;text-shadow:0 1px 0 #fff,0 0 26px #fff,0 0 12px #fff}
.headline h1::after{content:"";display:block;width:54px;height:6px;background:var(--amber);margin-top:14px}
.headline p{color:#2c3038;text-shadow:0 0 10px #fff,0 0 4px #fff;font-weight:600}
.city,.chip,.lang,.tools button{box-shadow:0 3px 12px rgba(20,22,28,.1)}
.flat,.day{box-shadow:0 6px 22px rgba(20,22,28,.06)}
.btn.main{color:#fff}
.day:first-child{background:linear-gradient(140deg,rgba(229,38,43,.12),#fff 70%);border-color:rgba(229,38,43,.4)}
.verdict{background:rgba(229,38,43,.08);border-color:rgba(229,38,43,.35)}
.pin i{width:13px;height:13px}
.subs{position:absolute;z-index:5;left:0;right:0;top:112px;display:flex;gap:6px;overflow-x:auto;padding:2px var(--gr) 6px var(--gl);scrollbar-width:none;touch-action:pan-x}
.subs::-webkit-scrollbar{display:none}
.subs button{flex:none;display:flex;align-items:center;gap:6px;font:600 11.5px/1 var(--body);padding:7px 10px;border-radius:999px;border:1px solid var(--line);background:var(--glass);color:var(--fg)}
.subs button::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.subs button[aria-pressed="true"]{background:var(--c);border-color:transparent}
.grid.row{display:flex;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:14px;margin-right:calc(-1*var(--gr));padding-right:var(--gr)}
.grid.row>.flat{flex:0 0 min(270px,78vw);scroll-snap-align:start}
.swipe{font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:-14px 0 14px}
@media (max-width:760px){.subs{top:104px}}
/* ---- final look: relief paper map + Apple-style interface (overrides the blocks above) ---- */
[data-v=r]{--night:#f5f5f7;--deep:#f5f5f7;--panel:#ffffff;--glass:rgba(255,255,255,.72);--line:rgba(0,0,0,.1);--fg:#1d1d1f;--muted:#6e6e73;--amber:#0071e3;--amber-t:#0066cc;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Helvetica Neue",Arial,sans-serif;--body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Helvetica Neue",Arial,sans-serif;--mono:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Helvetica Neue",Arial,sans-serif}
[data-v=r] body{-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
[data-v=r] #sky{background:linear-gradient(#cfe4f7 0%,#e9e7e1 42%,#e9e7e1 100%)}
[data-v=r] .stage::before{background:linear-gradient(rgba(245,245,247,.75),transparent)}
[data-v=r] #pins::after{display:none}
[data-v=r] .headline h1{font:700 clamp(34px,6.4vw,64px)/1.05 var(--display);letter-spacing:-.035em;color:#1d1d1f;text-shadow:0 0 22px #fff,0 0 10px #fff}
[data-v=r] .headline h1::after{display:none}
[data-v=r] .headline p{color:#1d1d1f;text-shadow:0 0 10px #fff,0 0 4px #fff;font-weight:500;font-size:17px;line-height:1.4}
[data-v=r] h2.t{font:700 clamp(28px,4.6vw,48px)/1.08 var(--display);letter-spacing:-.03em}
[data-v=r] .lead{font-size:17px;line-height:1.45}
[data-v=r] .eyebrow,[data-v=r] .swipe{font:600 12px/1 var(--body);letter-spacing:.02em;text-transform:none;color:var(--muted)}
[data-v=r] .eyebrow{color:#bf4800;font-size:14px}

    {k:'need',id:'gal',n:'Galereya mall (closed for now)',fr:'Centre commercial Galereya (fermé pour le moment)',ru:'ТРЦ «Галерея» (пока закрыт)',at:[43.0651,44.0355],ad:'пр. Кирова, 65',d:{en:'This shopping centre is closed for now. Only KFC (Rostic’s) works here. For shopping, go to Vershina Plaza.',fr:'Ce centre commercial est fermé pour le moment. Seul le KFC (Rostic’s) est ouvert. Pour les achats, va à Vershina Plaza.',ru:'Этот торговый центр пока закрыт. Работает только KFC (Rostic’s). За покупками езжай в «Вершина Плаза».'}},
    {k:'mfc',id:'mf1',n:'MFC, Universitetskaya St (centre)',fr:'MFC, rue Ouniversitetskaïa (centre)',ru:'МФЦ · ул. Университетская, 7',at:[43.06958,44.03799],d:{en:'In the city centre. At an MFC you can confirm your Gosuslugi account. Take your passport and your registration. Ask at your university first: they will tell you which papers a foreign student needs. Open: Mon–Thu 8:00–18:00, Fri 8:00–17:00.',fr:'Au centre-ville. Dans un MFC, tu peux confirmer ton compte Gosuslugi. Prends ton passeport et ton enregistrement. Demande d’abord à ton université : elle te dira quels papiers il faut pour un étudiant étranger. Ouvert : lun–jeu 8 h–18 h, ven 8 h–17 h.',ru:'В центре города. В МФЦ можно подтвердить учётную запись на Госуслугах. Возьми паспорт и регистрацию. Сначала спроси в вузе: там скажут, какие документы нужны иностранному студенту. Работает: пн–чт 8:00–18:00, пт 8:00–17:00.'}},
    {k:'mfc',id:'mf2',n:'MFC, Moskovskaya St',fr:'MFC, rue Moskovskaïa',ru:'МФЦ · ул. Московская, 72 к2',at:[43.05488,44.05700],d:{en:'The closest MFC to the main building. At an MFC you can confirm your Gosuslugi account. Take your passport and your registration. Ask at your university first: they will tell you which papers a foreign student needs. Open: Mon–Fri 9:00–18:00. Closed on Saturday and Sunday.',fr:'Le MFC le plus proche du bâtiment principal. Dans un MFC, tu peux confirmer ton compte Gosuslugi. Prends ton passeport et ton enregistrement. Demande d’abord à ton université : elle te dira quels papiers il faut pour un étudiant étranger. Ouvert : lun–ven 9 h–18 h. Fermé samedi et dimanche.',ru:'Ближайший МФЦ к главному корпусу. В МФЦ можно подтвердить учётную запись на Госуслугах. Возьми паспорт и регистрацию. Сначала спроси в вузе: там скажут, какие документы нужны иностранному студенту. Работает: пн–пт 9:00–18:00. Суббота и воскресенье — выходные.'}},
    {k:'mfc',id:'mf3',n:'MFC main office, Kollektivnaya St',fr:'MFC, bureau principal, rue Kollektivnaïa',ru:'МФЦ, главный офис · ул. Коллективная, 3',at:[43.0434,44.0319],d:{en:'The main MFC of the city. At an MFC you can confirm your Gosuslugi account. Take your passport and your registration. Ask at your university first: they will tell you which papers a foreign student needs. Open: Mon, Tue, Thu, Fri 8:00–18:00, Wed 8:00–20:00, Sat 9:00–13:00.',fr:'Le MFC principal de la ville. Dans un MFC, tu peux confirmer ton compte Gosuslugi. Prends ton passeport et ton enregistrement. Demande d’abord à ton université : elle te dira quels papiers il faut pour un étudiant étranger. Ouvert : lun, mar, jeu, ven 8 h–18 h, mer 8 h–20 h, sam 9 h–13 h.',ru:'Главный МФЦ города. В МФЦ можно подтвердить учётную запись на Госуслугах. Возьми паспорт и регистрацию. Сначала спроси в вузе: там скажут, какие документы нужны иностранному студенту. Работает: пн, вт, чт, пт 8:00–18:00, ср 8:00–20:00, сб 9:00–13:00.'}},
    {k:'mfc',id:'mf4',n:'MFC, Selskaya St',fr:'MFC, rue Selskaïa',ru:'МФЦ · ул. Сельская, 40',at:[43.0371,44.05088],d:{en:'In the west of the city, near Vershina Plaza. At an MFC you can confirm your Gosuslugi account. Take your passport and your registration. Ask at your university first: they will tell you which papers a foreign student needs. Open: Mon–Fri 9:00–18:00.',fr:'À l’ouest de la ville, près de Vershina Plaza. Dans un MFC, tu peux confirmer ton compte Gosuslugi. Prends ton passeport et ton enregistrement. Demande d’abord à ton université : elle te dira quels papiers il faut pour un étudiant étranger. Ouvert : lun–ven 9 h–18 h.',ru:'На западе города, недалеко от «Вершина Плаза». В МФЦ можно подтвердить учётную запись на Госуслугах. Возьми паспорт и регистрацию. Сначала спроси в вузе: там скажут, какие документы нужны иностранному студенту. Работает: пн–пт 9:00–18:00.'}},
    {k:'med',id:'m1',n:'City Hospital No. 1',fr:'Hôpital municipal n° 1',ru:'Городская больница № 1',at:[43.06586,44.04447],ad:'пр. Калинина, 39',d:{en:'The main city hospital, closest to the campus. In an emergency call 103 (ambulance) or 112, both free from any phone. Take your passport and insurance policy.',fr:'Le principal hôpital de la ville, le plus proche du campus. En cas d’urgence, appelez le 103 (ambulance) ou le 112, gratuits depuis tout téléphone. Prenez votre passeport et votre assurance.',ru:'Главная городская больница, ближайшая к корпусу. В экстренном случае звоните 103 (скорая) или 112 — бесплатно с любого телефона. Возьмите паспорт и страховой полис.'}},

    {k:'med',id:'m3',n:'Infectious Diseases Hospital',fr:'Hôpital des maladies infectieuses',ru:'Инфекционная больница',at:[43.06556,44.06482],ad:'рядом: ул. Лермонтовский разьезд, 7Б',d:{en:'For high fever with rash, food poisoning, hepatitis and other infections. An ambulance brings patients here.',fr:'Pour forte fièvre avec éruption, intoxication alimentaire, hépatite et autres infections. L’ambulance y conduit les patients.',ru:'При высокой температуре с сыпью, отравлениях, гепатите и других инфекциях. Сюда привозит скорая.'}},
    {k:'med',id:'m4',n:'Ambulance station',fr:'Station d’ambulances',ru:'Станция скорой помощи',at:[43.05962,44.02395],ad:'ул. Пащенко, 112',d:{en:'You do not go here yourself: call 103 or 112 and the ambulance comes to you. The call is free.',fr:'On n’y va pas soi-même : appelez le 103 ou le 112 et l’ambulance vient à vous. L’appel est gratuit.',ru:'Сюда не нужно ехать самому: позвоните 103 или 112, скорая приедет к вам. Звонок бесплатный.'}},

    {k:'police',id:'p1',n:'City police department',fr:'Commissariat central',ru:'Отдел МВД по г. Пятигорску · ул. Рубина, 2',at:[43.07746,44.03571],d:{en:'Main police station of the city. Emergency number: 102 or 112. Always carry your passport, migration card and registration, or photos of them.',fr:'Commissariat principal de la ville. Numéro d’urgence : 102 ou 112. Ayez toujours sur vous passeport, carte migratoire et enregistrement, ou leurs photos.',ru:'Главный отдел полиции города. Экстренный номер: 102 или 112. Всегда носите паспорт, миграционную карту и регистрацию или их фото.'}},

    {k:'food',id:'ff3',big:1,n:'KFC (now called Rostic’s)',fr:'KFC (maintenant Rostic’s)',ru:'KFC (теперь Rostic’s) · ТРЦ «Галерея»',at:[43.06498,44.03541],d:{en:'KFC in Russia is now called Rostic’s. Same fried chicken. It is in the Galereya shopping centre. Attention: the shopping centre itself is closed for now. Only KFC works.',fr:'En Russie, KFC s’appelle maintenant Rostic’s. Le même poulet frit. Il est dans le centre commercial Galereya. Attention : le centre commercial est fermé pour le moment. Seul le KFC est ouvert.',ru:'KFC в России теперь называется Rostic’s. Та же курица. Находится в ТРЦ «Галерея». Внимание: сам торговый центр пока закрыт. Работает только KFC.'}},

    {k:'pharm',id:'ph0',n:'Vita-Plus pharmacy by the tram stop',fr:'Pharmacie Vita-Plus près du tram',ru:'Аптека «Вита-Плюс» у остановки',at:[43.06361, 44.05433],d:{en:'The closest pharmacy to the main building. Open 08:00–22:00.',fr:'La pharmacie la plus proche du bâtiment principal. Ouverte de 8 h à 22 h.',ru:'Ближайшая аптека к главному корпусу. Работает с 08:00 до 22:00.'}},
    {k:'need',id:'mk2',n:'Lower Market',fr:'Marché Nijni',ru:'Нижний рынок · ул. Крайнего, 47',at:[43.07169,44.03783],d:{en:'The second big market, in the old centre: fruit, vegetables, meat, clothes.',fr:'Le deuxième grand marché, dans le vieux centre : fruits, légumes, viande, vêtements.',ru:'Второй большой рынок, в старом центре: фрукты, овощи, мясо, одежда.'}},
    {k:'need',id:'mk3',big:1,far:1,n:'Lira and Lyudmila markets',fr:'Marchés Lira et Lioudmila',ru:'Рынки «Лира» и «Людмила» · Георгиевское шоссе',at:[43.12833,44.03427],d:{en:'Very big markets on the edge of the city. Clothes, shoes, bags, things for home, cheaper than in shopping centres. You can ask for a lower price. HOW TO GO: take tram 4 or 8 from the “Universam” stop (near the main building) to the last stop, “Ulitsa Georgievskaya”. From there walk about 6 minutes. No change needed. Buses 21A, 28A and 31 go to the “Rynok Lyudmila” stop. WHEN: go in the morning. The markets open early (about 6:00) and close at about 16:00. Guides say different things about days off (some say Wednesday), so ask other students before you go.',fr:'De très grands marchés au bord de la ville. Vêtements, chaussures, sacs, objets pour la maison, moins cher que dans les centres commerciaux. Tu peux négocier. COMMENT Y ALLER : prends le tram 4 ou 8 à l’arrêt « Universam » (près du bâtiment principal) jusqu’au terminus « Oulitsa Gueorguievskaïa ». De là, environ 6 minutes à pied. Sans changement. Les bus 21A, 28A et 31 vont à l’arrêt « Rynok Lioudmila ». QUAND : vas-y le matin. Les marchés ouvrent tôt (vers 6 h) et ferment vers 16 h. Les annuaires ne sont pas d’accord sur les jours de fermeture (certains disent mercredi) : demande à d’autres étudiants avant d’y aller.',ru:'Очень большие рынки на краю города. Одежда, обувь, сумки, вещи для дома — дешевле, чем в торговых центрах. Можно торговаться. КАК ДОЕХАТЬ: садись на трамвай 4 или 8 на остановке «Универсам» (у главного корпуса) и езжай до конечной — «Улица Георгиевская». Оттуда около 6 минут пешком. Без пересадок. Автобусы 21А, 28А и 31 идут до остановки «Рынок Людмила». КОГДА: езжай утром. Рынки открываются рано (около 6:00) и закрываются около 16:00. Про выходные дни справочники пишут по-разному (некоторые — что среда), поэтому перед поездкой спроси у других студентов.'}},
    {k:'faith',id:'mq',big:1,n:'Mosque (Cathedral Mosque)',fr:'Mosquée (mosquée-cathédrale)',ru:'Мечеть (Соборная мечеть)',at:[43.03271,44.03944],ad:'ул. 50 лет ВЛКСМ, 2',d:{en:'The mosque of Pyatigorsk, in the west of the city (50 Let VLKSM Street area). Address guides give two addresses, so call before you go the first time: +7 (879) 339-90-50. Friday prayer brings many people: come early.',fr:'La mosquée de Piatigorsk, à l’ouest de la ville (quartier de la rue 50 Let VLKSM). Les annuaires donnent deux adresses : appelle avant ta première visite : +7 (879) 339-90-50. Le vendredi, il y a beaucoup de monde : viens tôt.',ru:'Мечеть Пятигорска, на западе города (район улицы 50 лет ВЛКСМ). В справочниках два адреса, поэтому перед первым визитом позвони: +7 (879) 339-90-50. В пятницу много людей — приходи заранее.'}},

    {k:'faith',id:'ch2',n:'St Lazarus Church (Orthodox)',fr:'Église Saint-Lazare (orthodoxe)',ru:'Лазаревская церковь',at:[43.0751,44.0452],ad:'ул. Пастухова, 1',d:{en:'An old Orthodox church at the foot of Mashuk. The closest church to the main building.',fr:'Une vieille église orthodoxe au pied du Machouk. L’église la plus proche du bâtiment principal.',ru:'Старая православная церковь у подножия Машука. Ближайшая церковь к главному корпусу.'}},
    {k:'faith',id:'ch3',n:'Archangel Michael Cathedral (Orthodox)',fr:'Cathédrale de l’Archange-Michel (orthodoxe)',ru:'Собор Михаила Архангела',at:[43.0521,44.0380],ad:'ул. Козлова, 39А',d:{en:'A big Orthodox cathedral near the railway station.',fr:'Une grande cathédrale orthodoxe près de la gare.',ru:'Большой православный собор у железнодорожного вокзала.'}},

    {k:'bank',id:'b5',n:'T-Bank ATM (ex-Tinkoff)',fr:'DAB T-Bank (ex-Tinkoff)',ru:'Банкомат Т-Банка (Тинькофф)',at:[43.03843,44.05278],ad:'ул. Адмиральского, 8 к1',d:{en:'T-Bank has no branches: the card is delivered to you by courier. This ATM works 08:00 to 23:00.',fr:'T-Bank n’a pas d’agences : la carte est livrée par coursier. Ce distributeur fonctionne de 8 h à 23 h.',ru:'У Т-Банка нет отделений: карту привозит курьер. Этот банкомат работает с 08:00 до 23:00.'}},
    {k:'go',id:'g1',big:1,n:'Central railway station',fr:'Gare centrale de Piatigorsk',ru:'Центральный ж/д вокзал',at:[43.0550,44.0378],ad:'рядом: ул. Октябрьская, 75',d:{en:'Suburban trains to Mineralnye Vody (airport city), Yessentuki and Kislovodsk.',fr:'Trains de banlieue vers Mineralnye Vody (aéroport), Iessentouki et Kislovodsk.',ru:'Электрички в Минеральные Воды, Ессентуки и Кисловодск.'}},
    {k:'go',n:'Lermontovskaya train stop',fr:'Halte ferroviaire Lermontovskaïa',ru:'Платформа Лермонтовская',at:[43.0650,44.0630],ad:'рядом: ул. Лермонтовский разьезд, 7А',d:{en:'Nearest suburban train stop to the campus.',fr:'Arrêt de train de banlieue le plus proche du campus.',ru:'Ближайшая к корпусу платформа электричек.'}},
    {k:'go',n:'Bus station “Upper Market”',fr:'Gare routière « Verkhni rynok »',ru:'Автостанция «Верхний рынок»',at:[43.0679,44.0414],ad:'ул. Леваневского, 18',d:{en:'City and suburban buses and minibuses leave from here, next to the Upper Market.',fr:'Les bus et minibus de la ville et de la banlieue partent d’ici, à côté du marché Verkhni.',ru:'Отсюда идут городские и пригородные автобусы и маршрутки. Рядом Верхний рынок.'}},
    {k:'meet',id:'pc1',n:'Paper Cup near PMFI Building 2',fr:'Paper Cup près du bâtiment 2 du PMFI',ru:'Paper Cup у корпуса № 2 · пр. Кирова, 37',at:[43.07389,44.03603],d:{en:'Many foreign students like this café. They come here in the day and in the evening. A good place to make new friends. Right next to PMFI Building 2.',fr:'Beaucoup d’étudiants étrangers aiment ce café. Ils y viennent le jour et le soir. Un bon endroit pour se faire de nouveaux amis. Juste à côté du bâtiment 2 du PMFI.',ru:'Многие иностранные студенты любят эту кофейню. Они приходят сюда и днём, и вечером. Хорошее место, чтобы найти новых друзей. Прямо у корпуса № 2 ПМФИ.'}},
    {k:'meet',id:'pc2',n:'Paper Cup near PMFI Building 4',fr:'Paper Cup près du bâtiment 4 du PMFI',ru:'Paper Cup у корпуса № 4 · ул. Крайнего, 43',at:[43.07119,44.04066],d:{en:'Another Paper Cup where students like to sit. Right next to PMFI Building 4.',fr:'Un autre Paper Cup où les étudiants aiment s’asseoir. Juste à côté du bâtiment 4 du PMFI.',ru:'Ещё один Paper Cup, где любят сидеть студенты. Прямо рядом с корпусом № 4 ПМФИ.'}},
    {k:'meet',id:'pc3',n:'Paper Cup by Komsomolsky Park',fr:'Paper Cup près du parc Komsomolski',ru:'Paper Cup у Комсомольского парка · ул. Орджоникидзе, 1',at:[43.06243,44.05353],d:{en:'Next to the Universam tram stop, between the main building and Komsomolsky Park. Open 8:00–23:00. Students often come here.',fr:'À côté de l’arrêt de tram Universam, entre le bâtiment principal et le parc Komsomolski. Ouvert de 8 h à 23 h. Les étudiants y viennent souvent.',ru:'Рядом с остановкой «Универсам», между главным корпусом и Комсомольским парком. Работает 8:00–23:00. Студенты часто сюда ходят.'}},
    {k:'meet',id:'pc4',n:'Paper Cup in Vershina Plaza',fr:'Paper Cup au centre Vershina Plaza',ru:'Paper Cup в «Вершина Плаза»',at:[43.03429,44.05106],ad:'ул. Ессентукская, 31А',d:{en:'In the big shopping centre. Students like to sit and study here.',fr:'Dans le grand centre commercial. Les étudiants aiment s’y asseoir pour étudier.',ru:'В большом торговом центре. Студенты любят здесь сидеть и учиться.'}},
    {k:'meet',id:'pc5',n:'Paper Cup, Oktyabrskaya St',fr:'Paper Cup, rue Oktiabrskaïa',ru:'Paper Cup · ул. Октябрьская, 38',at:[43.06484,44.03705],d:{en:'One more Paper Cup, in the city centre. A good place for a coffee with friends.',fr:'Encore un Paper Cup, au centre-ville. Un bon endroit pour un café entre amis.',ru:'Ещё один Paper Cup, в центре города. Хорошее место выпить кофе с друзьями.'}},
    {k:'meet',id:'hb',big:1,n:'Habibi (halal food)',fr:'Habibi (cuisine halal)',ru:'Habibi (халяль) · пр. 40 лет Октября, 95А',at:[43.06447,44.03654],d:{en:'Very tasty halal food. Many foreign students like this place.',fr:'Très bonne cuisine halal. Beaucoup d’étudiants étrangers aiment cet endroit.',ru:'Очень вкусная халяльная еда. Многие иностранные студенты любят это место.'}},
    {k:'meet',id:'hb2',big:1,n:'Habibi (halal food), R. Luxemburg St',fr:'Habibi (cuisine halal), rue Rosa-Luxemburg',ru:'Habibi (халяль) · ул. Розы Люксембург, 72А',at:[43.04137,44.04654],d:{en:'The second Habibi in the city. Halal food.',fr:'Le deuxième Habibi de la ville. Cuisine halal.',ru:'Вторая точка Habibi в городе. Халяльная еда.'}},
    {k:'food',id:'hm1',n:'Ferma26 Halal (meat shop)',fr:'Ferma26 Halal (boucherie)',ru:'«Ферма26 Халяль» (мясо) · ул. Московская, 74',at:[43.05376,44.05719],d:{en:'A halal meat shop: meat and sausages. Close to PMFI Building 5.',fr:'Une boucherie halal : viande et saucisses. Près du bâtiment 5 du PMFI.',ru:'Халяльная мясная лавка: мясо и колбасы. Рядом с корпусом № 5 ПМФИ.'}},
    {k:'food',id:'hm2',n:'Ferma26 Halal (meat shop), Butyrina St',fr:'Ferma26 Halal (boucherie), rue Boutyrina',ru:'«Ферма26 Халяль» (мясо) · ул. Бутырина, 3А',at:[43.03971,44.04889],d:{en:'The second shop of the same halal butcher. Open 9:00–20:00.',fr:'Le deuxième magasin de la même boucherie halal. Ouvert de 9 h à 20 h.',ru:'Второй магазин той же халяльной лавки. Работает 9:00–20:00.'}},
    {k:'food',id:'hm3',n:'Halal meat shop, Levanevskogo St',fr:'Boucherie halal, rue Levanevskogo',ru:'Мясной магазин «Халяль» · ул. Леваневского, 3А',at:[43.06988,44.04351],d:{en:'A halal meat shop near the Upper Market. Tue–Sun 8:00–16:30.',fr:'Une boucherie halal près du marché Verkhni. Du mardi au dimanche, 8 h–16 h 30.',ru:'Халяльный мясной магазин у Верхнего рынка. Вт–вс 8:00–16:30.'}},
    {k:'study',id:'coco',big:1,n:'Coco coworking',fr:'Coworking Coco',ru:'Коворкинг «Коко» · ул. Дзержинского, 49а',at:[43.07557,44.03593],d:{en:'A special place to study and work. Very fast internet. There is an English Club and other events.',fr:'Un endroit fait pour étudier et travailler. Internet très rapide. Il y a un English Club et d’autres événements.',ru:'Специальное место для учёбы и работы. Очень быстрый интернет. Есть English Club и разные мероприятия.'}},
    {k:'study',id:'ok1',n:'Okta-Brew café (good Wi-Fi)',fr:'Café Okta-Brew (bon Wi-Fi)',ru:'Кофейня «Окта-Брю» · пр. 40 лет Октября, 58а',at:[43.06371,44.04055],d:{en:'A coffee place with good Wi-Fi. You can sit with a laptop and work or study. In the Eurocity shopping centre.',fr:'Un café avec un bon Wi-Fi. Tu peux t’asseoir avec ton ordinateur pour travailler ou étudier. Dans le centre commercial Eurocity.',ru:'Кофейня с хорошим Wi-Fi. Можно сидеть с ноутбуком, работать или учиться. В ТЦ «Евросити».'}},
    {k:'study',id:'ok2',n:'Okta-Brew café (good Wi-Fi), Kirov Ave',fr:'Café Okta-Brew (bon Wi-Fi), av. Kirov',ru:'Кофейня «Окта-Брю» · пр. Кирова, 24',at:[43.08128,44.03738],d:{en:'The second Okta-Brew, in the old centre near Tsvetnik Park. Good Wi-Fi.',fr:'Le deuxième Okta-Brew, dans le vieux centre près du parc Tsvetnik. Bon Wi-Fi.',ru:'Вторая «Окта-Брю», в старом центре у парка «Цветник». Хороший Wi-Fi.'}},
    {k:'cinema',id:'kn1',n:'Kino-Vershina cinema',fr:'Cinéma Kino-Vershina',ru:'Кинотеатр «Кино-Вершина» · ул. Ессентукская, 31а',at:[43.03385,44.05133],d:{en:'A modern cinema in the Vershina Plaza shopping centre. Open every day 10:00–23:00. Films are in Russian.',fr:'Un cinéma moderne dans le centre commercial Vershina Plaza. Ouvert tous les jours de 10 h à 23 h. Les films sont en russe.',ru:'Современный кинотеатр в ТРЦ «Вершина Плаза». Работает каждый день 10:00–23:00. Фильмы на русском.'}},
    {k:'cinema',id:'kn2',n:'Kosmos cinema',fr:'Cinéma Kosmos',ru:'Кинотеатр «Космос» · ул. Октябрьская, 8',at:[43.07217,44.03748],d:{en:'A cinema in the city centre. Films are in Russian.',fr:'Un cinéma au centre-ville. Les films sont en russe.',ru:'Кинотеатр в центре города. Фильмы на русском.'}},
    {k:'cinema',id:'kn3',n:'Drugar cinema',fr:'Cinéma Drougar',ru:'Кинотеатр «Другар» · ул. Орджоникидзе, 7Б',at:[43.06148,44.05672],d:{en:'The closest cinema to the main building, next to Komsomolsky Park. Films are in Russian.',fr:'Le cinéma le plus proche du bâtiment principal, à côté du parc Komsomolski. Les films sont en russe.',ru:'Ближайший кинотеатр к главному корпусу, у Комсомольского парка. Фильмы на русском.'}},
    {k:'sport',id:'sp1',n:'Alex Fitness',fr:'Alex Fitness',ru:'Alex Fitness · ул. Ессентукская, 31а',at:[43.0342,44.05121],d:{en:'A big, well-known fitness club in the Vershina Plaza shopping centre.',fr:'Un grand club de fitness connu, dans le centre commercial Vershina Plaza.',ru:'Большой известный фитнес-клуб в ТРЦ «Вершина Плаза».'}},
    {k:'sport',id:'sp2',n:'Atmosfera fitness club',fr:'Club de fitness Atmosfera',ru:'Фитнес-клуб «Атмосфера» · ул. Адмиральского, 8 к1',at:[43.03841,44.05304],d:{en:'A fitness club with a gym, in the west of the city.',fr:'Un club de fitness avec salle de musculation, à l’ouest de la ville.',ru:'Фитнес-клуб с тренажёрным залом, на западе города.'}},
    {k:'sport',id:'sp3',n:'Gym Sport Premium',fr:'Gym Sport Premium',ru:'Gym Sport Premium · Бештаугорское шоссе, 34',at:[43.03632,44.05948],d:{en:'A gym in the west of the city.',fr:'Une salle de sport à l’ouest de la ville.',ru:'Тренажёрный зал на западе города.'}},
    {k:'sport',id:'sp4',n:'Berkut Fight Club (boxing, grappling, MMA)',fr:'Berkut Fight Club (boxe, grappling, MMA)',ru:'Berkut Fight Club (бокс, грэпплинг, ММА) · пр. Кирова, 50',at:[43.07229,44.03668],d:{en:'A fight club in the Novy Arbat centre, 3rd floor: boxing, grappling, judo and MMA. Call or visit first to ask about times and prices.',fr:'Un club de combat dans le centre Novy Arbat, 3e étage : boxe, grappling, judo et MMA. Appelle ou passe d’abord pour les horaires et les prix.',ru:'Клуб единоборств в ТРЦ «Новый Арбат», 3 этаж: бокс, грэпплинг, дзюдо и ММА. Сначала позвони или зайди — узнай расписание и цены.'}},
    {k:'sport',id:'sp5',n:'Coliseum club (boxing, judo, MMA, wrestling)',fr:'Club Coliseum (boxe, judo, MMA, lutte)',ru:'Клуб «Колизей» (бокс, дзюдо, ММА, борьба) · ул. Теплосерная, 62а',at:[43.08582,44.03431],d:{en:'A sports club with boxing, judo, MMA and wrestling. Phone: 8 (928) 303-30-05.',fr:'Un club de sport avec boxe, judo, MMA et lutte. Téléphone : 8 (928) 303-30-05.',ru:'Спортивный клуб: бокс, дзюдо, ММА и борьба. Телефон: 8 (928) 303-30-05.'}},
    {k:'sport',id:'sp6',n:'Taekwondo club Kerugi',fr:'Club de taekwondo Kerugi',ru:'Клуб тхэквондо «Керуги»',at:[43.05772,44.05108],d:{en:'Taekwondo, 10 minutes on foot from the main building.',fr:'Taekwondo, à 10 minutes à pied du bâtiment principal.',ru:'Тхэквондо, 10 минут пешком от главного корпуса.'}},
    {k:'fun',id:'bal',big:1,far:1,sky:1,n:'Hot-air balloon flight',fr:'Vol en montgolfière',ru:'Полёт на воздушном шаре',at:[43.0560,44.0440],tel:['+7 918 316-95-85','+7 962 402-95-97'],d:{en:'You can fly over the mountains in a hot-air balloon. Flights are early in the morning and only in good weather, usually near Pyatigorsk, Yessentuki or Zheleznovodsk. Ask the price when you call. Call to book: “Aerostat” club or “Aeronavt” club.',fr:'Tu peux voler au-dessus des montagnes en montgolfière. Les vols ont lieu tôt le matin et seulement par beau temps, près de Piatigorsk, Iessentouki ou Jeleznovodsk. Demande le prix quand tu appelles. Appelle pour réserver : club « Aerostat » ou club « Aeronavt ».',ru:'Можно полетать над горами на воздушном шаре. Летают рано утром и только в хорошую погоду, обычно около Пятигорска, Ессентуков или Железноводска. Цену спроси по телефону. Звони и записывайся: клуб «Аэростат» или клуб «Аэронавт».'}},
    {k:'fun',id:'hr1',far:1,n:'Horse riding: Beshtau club',fr:'Balades à cheval : club Bechtaou',ru:'Конные прогулки: клуб «Бештау» · Бештаугорское шоссе, 1',at:[42.98835,44.08106],tel:['+7 906 465-65-65'],d:{en:'A horse club at the foot of Mount Beshtau. You can ride a horse with a teacher, even if it is your first time. Go by taxi. Call first.',fr:'Un club équestre au pied du mont Bechtaou. Tu peux monter à cheval avec un moniteur, même pour la première fois. Vas-y en taxi. Appelle d’abord.',ru:'Конный клуб у подножия Бештау. Можно покататься на лошади с инструктором, даже если это первый раз. Ехать на такси. Сначала позвони.'}},
    {k:'fun',id:'hr2',far:1,n:'Horse riding: Nasib club',fr:'Balades à cheval : club Nasib',ru:'Конные прогулки: клуб «Насиб» · ул. Ермолова, 219',at:[42.9902,44.0510],d:{en:'A horse club near the hippodrome (the tram stop is “Skachki”). The riding season is May to September.',fr:'Un club équestre près de l’hippodrome (arrêt de tram « Skatchki »). La saison va de mai à septembre.',ru:'Конный клуб у ипподрома (остановка трамвая «Скачки»). Сезон — с мая по сентябрь.'}},
    {k:'fun',id:'hr3',far:1,n:'Horse riding: KoniPark',fr:'Balades à cheval : KoniPark',ru:'Конные прогулки: KoniPark',at:[43.1050,44.0200],tel:['+7 923 693-31-40'],d:{en:'Horse rides on paths outside the city, also for two people. Every day 10:00–18:00. The place on our map is not exact: call and ask where to come.',fr:'Balades à cheval sur des sentiers hors de la ville, aussi à deux. Tous les jours de 10 h à 18 h. Le point sur notre carte n’est pas exact : appelle pour savoir où venir.',ru:'Прогулки на лошадях по тропам за городом, можно вдвоём. Каждый день 10:00–18:00. Точка на нашей карте неточная — позвони и спроси, куда приезжать.'}},
    {k:'walk',id:'wk1',n:'Kirov Avenue, the “Broadway”',fr:'Avenue Kirov, le « Broadway »',ru:'Проспект Кирова, «Бродвей»',at:[43.0772,44.0368],ad:'рядом: ул. Соборная, 1А',d:{en:'The main walking street of the city. People call it Broadway. Cafés, benches, music and many people every evening. It leads to Tsvetnik Park.',fr:'La grande rue piétonne de la ville. On l’appelle Broadway. Cafés, bancs, musique et beaucoup de monde chaque soir. Elle mène au parc Tsvetnik.',ru:'Главная прогулочная улица города. Её называют Бродвей. Кафе, скамейки, музыка и много людей каждый вечер. Ведёт к парку «Цветник».'}},
    {k:'walk',id:'wk2',n:'Komsomolsky Park',fr:'Parc Komsomolski',ru:'Комсомольский парк',at:[43.06196,44.05747],ad:'рядом: ул. Орджоникидзе, 7Б',d:{en:'A big green park close to the main building. Good for a walk, a run or to sit with friends after class.',fr:'Un grand parc vert près du bâtiment principal. Bien pour marcher, courir ou s’asseoir avec des amis après les cours.',ru:'Большой зелёный парк рядом с главным корпусом. Хорошо гулять, бегать или сидеть с друзьями после пар.'}},
    {k:'see',id:'s1',n:'Proval',fr:'Le Proval',ru:'Провал',at:[43.0987,44.0467],ad:'бул. Гагарина',d:{en:'The symbol of the city: a 40 m deep cave in Mashuk with a turquoise sulphur lake at the bottom. You walk in through a tunnel. Free.',fr:'Le symbole de la ville : une grotte de 40 m dans le Machouk avec un lac sulfureux turquoise au fond. On y entre par un tunnel. Gratuit.',ru:'Символ города: пещера глубиной 40 м в Машуке с бирюзовым сероводородным озером. Вход через тоннель, бесплатно.'}},
    {k:'see',id:'s2',n:'Mashuk summit, 993 m',fr:'Sommet du Machouk, 993 m',ru:'Вершина Машука, 993 м',at:[43.0889,44.0500],d:{en:'View over the whole city, Beshtau and, on a clear day, Elbrus. TV tower and a viewing deck. Go up by cable car or on foot.',fr:'Vue sur toute la ville, le Bechtaou et, par temps clair, l’Elbrouz. Tour de télévision et plateforme panoramique. Montée en téléphérique ou à pied.',ru:'Вид на весь город, Бештау и в ясную погоду на Эльбрус. Телевышка и смотровая площадка. Подняться можно на канатке или пешком.'}},
    {k:'see',id:'s3',n:'Mashuk cable car',fr:'Téléphérique du Machouk',ru:'Канатная дорога на Машук',at:[43.08135,44.04368],ad:'бул. Гагарина, 2',d:{en:'Two cabins: one goes up, the other comes down. The ride takes about 3 minutes. Price in 2026: about 500 ₽ up and down, about 300 ₽ one way. Prices change often, so check at the ticket office. Open every day from 9:00, closes at 18:00–20:00 (depends on the season and the weather).',fr:'Deux cabines : l’une monte, l’autre descend. Le trajet dure environ 3 minutes. Prix en 2026 : environ 500 ₽ aller-retour, environ 300 ₽ l’aller simple. Les prix changent souvent : vérifie à la caisse. Ouvert tous les jours dès 9 h, ferme entre 18 h et 20 h (selon la saison et la météo).',ru:'Два вагончика: один поднимается, другой спускается. Подъём — около 3 минут. Цена в 2026 году: около 500 ₽ туда и обратно, около 300 ₽ в одну сторону. Цены часто меняются — уточняй в кассе. Работает каждый день с 9:00, закрывается в 18:00–20:00 (зависит от сезона и погоды).'}},
    {k:'see',id:'s4',n:'Aeolian Harp',fr:'La Harpe éolienne',ru:'Эолова арфа',at:[43.0883,44.0408],ad:'бул. Гагарина, 2Б',d:{en:'A stone pavilion from 1831 on the edge of a cliff. The best sunset view in the city.',fr:'Un pavillon de pierre de 1831 au bord d’une falaise. Le plus beau coucher de soleil de la ville.',ru:'Каменная беседка 1831 года на краю скалы. Лучший закат в городе.'}},
    {k:'see',id:'s5',n:'Academic Gallery',fr:'Galerie académique',ru:'Академическая галерея',at:[43.0880,44.0398],ad:'пр. Кирова, 1А',d:{en:'White gallery above the old town with a wide staircase and a view over the centre.',fr:'Galerie blanche au-dessus de la vieille ville avec un grand escalier et une vue sur le centre.',ru:'Белая галерея над старым городом, широкая лестница и вид на центр.'}},
    {k:'walk',id:'s6',n:'Tsvetnik Park',fr:'Parc Tsvetnik',ru:'Парк «Цветник»',at:[43.08191,44.03679],ad:'пр. Кирова, 21А',d:{en:'The old resort centre: the Lermontov Gallery, Diana’s Grotto, fountains, evening walks.',fr:'Le vieux centre thermal : galerie Lermontov, grotte de Diane, fontaines, promenades du soir.',ru:'Старый курортный центр: Лермонтовская галерея, грот Дианы, фонтаны, вечерние прогулки.'}},
    {k:'see',id:'s7',n:'Eagle sculpture',fr:'Sculpture de l’Aigle',ru:'Скульптура «Орёл»',at:[43.0834,44.0373],ad:'пр. Кирова, 18',d:{en:'A bronze eagle fighting a snake, the emblem of the Caucasus spa towns. Everyone takes a photo here.',fr:'Un aigle de bronze luttant contre un serpent, emblème des villes thermales du Caucase. Tout le monde s’y prend en photo.',ru:'Бронзовый орёл со змеёй — эмблема Кавказских Минеральных Вод. Здесь фотографируются все.'}},
    {k:'see',id:'s8',n:'Chinese Pavilion',fr:'Pavillon chinois',ru:'Китайская беседка',at:[43.0830,44.0355],d:{en:'Colourful pavilion on Goryachaya hill with a view of the city and the mountains.',fr:'Pavillon coloré sur la colline Goriatchaïa avec vue sur la ville et les montagnes.',ru:'Яркая беседка на горе Горячей с видом на город и горы.'}},
    {k:'see',id:'s9',n:'Lermontov’s Grotto',fr:'Grotte de Lermontov',ru:'Грот Лермонтова',at:[43.0871,44.0399],ad:'рядом: пр. Кирова, 1А',d:{en:'A small cave in the rock where the poet Lermontov liked to sit.',fr:'Une petite grotte dans la roche où le poète Lermontov aimait s’asseoir.',ru:'Небольшой грот в скале, где любил бывать Лермонтов.'}},
    {k:'see',id:'s10',n:'Lermontov duel site',fr:'Lieu du duel de Lermontov',ru:'Место дуэли Лермонтова',at:[43.0772,44.0590],ad:'вокруг горы Машук от проспекта Калинина до санатория им. С.М.Кирова',d:{en:'Monument in the forest on the slope of Mashuk where the poet was killed in a duel in 1841.',fr:'Monument dans la forêt, sur la pente du Machouk, où le poète fut tué en duel en 1841.',ru:'Памятник в лесу на склоне Машука, где поэт погиб на дуэли в 1841 году.'}},
    {k:'see',id:'s11',n:'Lermontov House Museum',fr:'Maison-musée de Lermontov',ru:'Домик Лермонтова',at:[43.0778,44.0399],ad:'ул. Буачидзе, 5',d:{en:'The small house where Lermontov spent his last months.',fr:'La petite maison où Lermontov passa ses derniers mois.',ru:'Домик, где Лермонтов прожил последние месяцы.'}},
    {k:'see',id:'s12',n:'Gates of Love',fr:'Portes de l’amour',ru:'Ворота любви',at:[43.0775,44.0500],ad:'от бульвара Гагарина до проспекта Калинина',d:{en:'Stone arch on the slope of Mashuk. Couples walk through it holding hands.',fr:'Arche de pierre sur la pente du Machouk. Les couples la traversent main dans la main.',ru:'Каменная арка на склоне Машука. Пары проходят через неё, держась за руки.'}},
    {k:'see',id:'s13',n:'Singing Fountain',fr:'Fontaine musicale',ru:'Поющий фонтан',at:[43.0719,44.0400],ad:'рядом: пл. Ленина, 3',d:{en:'Light and music fountain on Lenin Square in the warm season, in the evening.',fr:'Fontaine musicale et lumineuse place Lénine, le soir à la belle saison.',ru:'Светомузыкальный фонтан на площади Ленина, вечером в тёплый сезон.'}},
    {k:'walk',id:'s14',n:'Kirov Park',fr:'Parc Kirov',ru:'Парк им. Кирова',at:[43.06182,44.03275],d:{en:'Lake with boats, rides, a stadium.',fr:'Lac avec barques, manèges, stade.',ru:'Озеро с лодками, аттракционы, стадион.'}},

    {k:'walk',id:'h1',n:'Walk around Mashuk',fr:'Promenade autour du Machouk',ru:'Прогулка вокруг Машука',at:[43.0772,44.0590],ad:'вокруг горы Машук от проспекта Калинина до санатория им. С.М.Кирова',d:{en:'Start here, at the place of Lermontov’s duel. There is a kiosk: hot coffee in winter, cold drinks in summer. From here a wide, easy path goes around the whole mountain, in the forest. You can go left or right: both ways bring you to the Gates of Love and back. The full circle is about 10 km, 2.5–3 hours on foot. In summer you can rent a bike.',fr:'Commence ici, au lieu du duel de Lermontov. Il y a un kiosque : café chaud en hiver, boissons fraîches en été. D’ici, un chemin large et facile fait le tour de toute la montagne, dans la forêt. Tu peux partir à gauche ou à droite : les deux sens mènent aux Portes de l’amour et retour. Le tour complet fait environ 10 km, 2 h 30 à 3 h à pied. En été, tu peux louer un vélo.',ru:'Начни здесь, у места дуэли Лермонтова. Тут есть киоск: зимой горячий кофе, летом холодные напитки. Отсюда широкая лёгкая дорожка идёт вокруг всей горы, по лесу. Можно пойти налево или направо: оба пути ведут к Воротам любви и обратно. Весь круг — около 10 км, 2,5–3 часа пешком. Летом можно взять велосипед напрокат.'}},
    {k:'hike',id:'h2',n:'Walk up to Mashuk summit',fr:'Montée à pied au Machouk',ru:'Пеший подъём на Машук',at:[43.0883,44.0462],d:{en:'A forest trail from the ring path to the top, 993 m. About 1.5 hours up. Take water and normal shoes; ride the cable car down if you are tired.',fr:'Un sentier forestier du chemin circulaire jusqu’au sommet, 993 m. Environ 1 h 30 de montée. Prenez de l’eau et de bonnes chaussures ; redescendez en téléphérique si vous êtes fatigué.',ru:'Лесная тропа от терренкура до вершины, 993 м. Подъём около 1,5 часа. Возьмите воду и нормальную обувь; вниз можно на канатке.'}},
    {k:'hike',id:'h3',n:'Mount Kazachka viewpoint',fr:'Belvédère du mont Kazatchka',ru:'Гора Казачка',at:[43.0774,44.0460],ad:'ул. Пастухова',d:{en:'A short climb close to the centre with a view over the city.',fr:'Une courte montée près du centre avec vue sur la ville.',ru:'Короткий подъём рядом с центром, вид на город.'}},
    {k:'hike',id:'h4',n:'Mount Beshtau, 1400 m',fr:'Mont Bechtaou, 1400 m',ru:'Гора Бештау, 1400 м',at:[43.0221,44.0981],d:{en:'The five-peaked mountain you see from the dorms. A full-day hike for a group; in May the slopes are covered with wild poppies. Do not go alone or in bad weather.',fr:'La montagne à cinq sommets que l’on voit depuis les résidences. Une randonnée d’une journée, en groupe ; en mai, les pentes sont couvertes de coquelicots. N’y allez pas seul ni par mauvais temps.',ru:'Пятиглавая гора, которую видно из общежитий. Поход на целый день для компании; в мае склоны в маках. Не ходите в одиночку и в плохую погоду.'}},
    {k:'hike',id:'h6',far:1,n:'Orlinye Skaly (Eagle Rocks) on Beshtau',fr:'Orlinye Skaly (Rochers de l’Aigle), Bechtaou',ru:'Орлиные скалы на Бештау',at:[43.01247,44.10953],d:{en:'High grey rocks on the north side of Mount Beshtau, with a wide view over the forest and the town of Lermontov. One of the most beautiful places near the city. It is a real hike: go with friends, in good shoes, with water, and only in good weather. Stay away from the edge of the rocks.',fr:'De hauts rochers gris sur le versant nord du mont Bechtaou, avec une grande vue sur la forêt et la ville de Lermontov. L’un des plus beaux endroits près de la ville. C’est une vraie randonnée : vas-y avec des amis, de bonnes chaussures, de l’eau, et seulement par beau temps. Ne t’approche pas du bord.',ru:'Высокие серые скалы на северной стороне Бештау, с широким видом на лес и город Лермонтов. Одно из самых красивых мест рядом с городом. Это настоящий поход: иди с друзьями, в удобной обуви, с водой и только в хорошую погоду. Не подходи к краю скал.'}},
    {k:'hike',id:'h5',n:'Monastery Lake on Beshtau',fr:'Lac du monastère, Bechtaou',ru:'Монастырское озеро',at:[43.0102,44.0849],d:{en:'A quiet forest lake near the monastery on the slope of Beshtau.',fr:'Un lac forestier paisible près du monastère, sur la pente du Bechtaou.',ru:'Тихое лесное озеро у монастыря на склоне Бештау.'}},

    {k:'spring',id:'w1',n:'“Shameless” hot pools',fr:'Bains chauds « sans pudeur »',ru:'Бесстыжие ванны',at:[43.0929,44.0402],ad:'рядом: бул. Гагарина, 4',d:{en:'Free open-air pools with warm sulphur water on the slope of Mashuk. Locals bathe here all year. Bring a towel; the smell of sulphur is normal.',fr:'Bassins gratuits en plein air d’eau sulfureuse chaude sur la pente du Machouk. Les habitants s’y baignent toute l’année. Prenez une serviette ; l’odeur de soufre est normale.',ru:'Бесплатные открытые ванны с тёплой сероводородной водой на склоне Машука. Местные купаются круглый год. Возьмите полотенце; запах серы — это нормально.'}},
    {k:'spring',id:'w2',n:'Pump room No. 7, warm narzan',fr:'Buvette n° 7, narzan chaud',ru:'Бювет источника № 7 (тёплый нарзан)',at:[43.0816,44.0429],ad:'рядом: бул. Гагарина, 2',d:{en:'Drink warm mineral water straight from the spring. Bring your own cup.',fr:'Buvez l’eau minérale chaude directement à la source. Apportez votre gobelet.',ru:'Тёплая минеральная вода прямо из источника. Возьмите свой стакан.'}},
    {k:'spring',id:'w3',n:'Pump rooms No. 2 and No. 17',fr:'Buvettes n° 2 et n° 17',ru:'Бюветы источников № 2 и № 17',at:[43.0821,44.0375],ad:'пр. Кирова, 26А',d:{en:'Drinking springs in Tsvetnik Park, in the old resort centre.',fr:'Sources d’eau potable dans le parc Tsvetnik, au vieux centre thermal.',ru:'Питьевые источники в парке «Цветник», в старом курортном центре.'}},
    {k:'spring',id:'w4',n:'Mikhailovsky spring',fr:'Source Mikhaïlovski',ru:'Михайловский источник',at:[43.0888,44.0406],ad:'бул. Гагарина, 2Б',d:{en:'A historic spring by the Mikhailovskaya Gallery, next to the Aeolian Harp.',fr:'Une source historique près de la galerie Mikhaïlovskaïa, à côté de la Harpe éolienne.',ru:'Исторический источник у Михайловской галереи, рядом с Эоловой арфой.'}},
    {k:'spring',id:'w5',n:'Lermontov Baths',fr:'Bains Lermontov',ru:'Лермонтовские ванны',at:[43.0824,44.0366],ad:'пр. Кирова, 21А',d:{en:'The oldest bathhouse in the city, 1831. Mineral baths are still given here.',fr:'Le plus ancien établissement de bains de la ville, 1831. On y prend encore des bains minéraux.',ru:'Старейшее здание ванн в городе, 1831 год. Минеральные ванны принимают до сих пор.'}},
    {k:'spring',id:'w6',n:'Pirogov Baths',fr:'Bains Pirogov',ru:'Пироговские ванны',at:[43.0921,44.0407],ad:'бул. Гагарина, 4',d:{en:'Sulphur baths on the slope of Mashuk.',fr:'Bains sulfureux sur la pente du Machouk.',ru:'Сероводородные ванны на склоне Машука.'}}

flLead:{en:'In Russia you must be registered at the place where you live. Many owners say no. Here the owner already said yes.',fr:'En Russie, tu dois être enregistré là où tu habites. Beaucoup de propriétaires disent non. Ici, le propriétaire a déjà dit oui.',ru:'В России нужно быть зарегистрированным там, где живёшь. Многие хозяева отказывают. Здесь хозяин уже согласен.'},
st1b:{en:'1. Pick an apartment',fr:'1. Choisis un logement',ru:'1. Выбери квартиру'},st1:{en:'Write to us on Telegram. English, French or Russian.',fr:'Écris-nous sur Telegram. Français, anglais ou russe.',ru:'Напиши нам в Telegram. Английский, французский или русский.'},

st3b:{en:'3. Move in',fr:'3. Tu emménages',ru:'3. Заселяйся'},st3:{en:'You pay us one month of rent. Only once, and only after you sign.',fr:'Tu nous paies un mois de loyer. Une seule fois, et seulement après la signature.',ru:'Ты платишь нам один месяц аренды. Один раз и только после договора.'},

rgLead:{en:'Rules change. Always confirm the current deadline with the PMFI international office before you move.',fr:'Les règles changent. Confirmez toujours le délai actuel auprès du bureau international du PMFI avant de déménager.',ru:'Правила меняются. Перед переездом уточняйте актуальные сроки в международном отделе ПМФИ.'},
rg:{en:[['What is it?','Migration registration is a paper that says at which address you stay in Russia. You need it together with your passport, visa and migration card.'],['Who does it?','Not you. The host does: the university if you live in a dorm, the owner if you rent a flat.'],['When?','Within 7 working days after you arrive or move to a new address.'],['Why is it hard to rent?','Many owners do not want to file papers for a foreign tenant. Without registration you risk a fine and problems with your visa.']],
fr:[['Qu’est-ce que c’est ?','L’enregistrement migratoire est un document indiquant à quelle adresse vous séjournez en Russie. Il accompagne votre passeport, votre visa et votre carte migratoire.'],['Qui le fait ?','Pas vous. C’est l’hôte : l’université si vous êtes en résidence, le propriétaire si vous louez.'],['Quand ?','Dans les 7 jours ouvrables après votre arrivée ou votre déménagement.'],['Pourquoi est-ce difficile de louer ?','Beaucoup de propriétaires ne veulent pas faire les démarches pour un locataire étranger. Sans enregistrement, vous risquez une amende et des problèmes de visa.']],
ru:[['Что это?','Миграционный учёт — документ о том, по какому адресу вы находитесь в России. Нужен вместе с паспортом, визой и миграционной картой.'],['Кто оформляет?','Не вы, а принимающая сторона: вуз, если вы в общежитии, или хозяин квартиры, если снимаете.'],['Когда?','В течение 7 рабочих дней после приезда или переезда на новый адрес.'],['Почему трудно снять?','Многие хозяева не хотят оформлять документы на иностранца. Без регистрации — штраф и проблемы с визой.']]},

trLead:{en:'The tram is the cheapest way to cross the city: about 35 ₽ a ride, pay by card to the conductor. Your stop is Universam (Универсам).',fr:'Le tram est le moyen le moins cher de traverser la ville : environ 35 ₽ le trajet, paiement par carte au contrôleur. Votre arrêt est Universam (Универсам).',ru:'Трамвай — самый дешёвый способ ездить по городу: около 35 ₽ за поездку, оплата картой кондуктору. Ваша остановка — «Универсам».'},

un:{en:[['🗓','Class timetable','Timetables for Pharmacy, Dentistry, General Medicine and Medical Biochemistry. Check it every week: it shows the building number for each class.','Open the timetable','https://pmedpharm.ru/students/studentu_ochniku/'],['🧑‍💼','Office for foreign students','The dean’s office of the Faculty for Foreign Citizens. Dorm No. 2, 2nd floor. Open 8:30–17:00, break 13:00–13:30. Phone +7 (8793) 32-04-46. E-mail: dekanatis2015@mail.ru','Open the page','https://pmedpharm.ru/departments/in_gr/'],['💻','Personal account and online classes','Your marks, your portfolio and online courses.','Open the account','https://lk.pmedpharm.ru/'],['📚','Library','The university library and free online textbooks for students.','Open the library','https://pmedpharm.ru/departments/nauchnaya_biblioteka_pyatigorskogo_filiala_volggmu/'],['🩺','Medical point','In Dorm No. 2, 5th floor. Mon–Fri 8:30–16:30. First medical help for students.','Open the page','https://pmedpharm.ru/info_inst/med_punkt/'],['💬','Psychological help','Feeling sad, stressed or alone? You can write to the university psychologist: ovz@pmedpharm.ru','Open the page','https://pmedpharm.ru/kabinet-psihologa/']],
fr:[['🗓','Emploi du temps','Les emplois du temps de Pharmacie, Odontologie, Médecine générale et Biochimie médicale. Regarde-le chaque semaine : il indique le numéro du bâtiment pour chaque cours.','Ouvrir l’emploi du temps','https://pmedpharm.ru/students/studentu_ochniku/'],['🧑‍💼','Bureau des étudiants étrangers','Le décanat de la Faculté des étudiants étrangers. Résidence n° 2, 2e étage. Ouvert de 8 h 30 à 17 h, pause de 13 h à 13 h 30. Tél. +7 (8793) 32-04-46. E-mail : dekanatis2015@mail.ru','Ouvrir la page','https://pmedpharm.ru/departments/in_gr/'],['💻','Espace personnel et cours en ligne','Tes notes, ton portfolio et les cours en ligne.','Ouvrir l’espace','https://lk.pmedpharm.ru/'],['📚','Bibliothèque','La bibliothèque de l’université et des manuels en ligne gratuits pour les étudiants.','Ouvrir la bibliothèque','https://pmedpharm.ru/departments/nauchnaya_biblioteka_pyatigorskogo_filiala_volggmu/'],['🩺','Point médical','Dans la résidence n° 2, 5e étage. Du lundi au vendredi, 8 h 30–16 h 30. Premiers soins pour les étudiants.','Ouvrir la page','https://pmedpharm.ru/info_inst/med_punkt/'],['💬','Aide psychologique','Tu te sens triste, stressé ou seul ? Tu peux écrire au psychologue de l’université : ovz@pmedpharm.ru','Ouvrir la page','https://pmedpharm.ru/kabinet-psihologa/']],
ru:[['🗓','Расписание занятий','Расписание для фармации, стоматологии, лечебного дела и медицинской биохимии. Смотри каждую неделю: там указан номер корпуса для каждой пары.','Открыть расписание','https://pmedpharm.ru/students/studentu_ochniku/'],['🧑‍💼','Деканат иностранных студентов','Деканат факультета по обучению иностранных граждан. Общежитие № 2, 2 этаж. Работает 8:30–17:00, перерыв 13:00–13:30. Тел. +7 (8793) 32-04-46. Почта: dekanatis2015@mail.ru','Открыть страницу','https://pmedpharm.ru/departments/in_gr/'],['💻','Личный кабинет и онлайн-занятия','Твои оценки, портфолио и онлайн-курсы.','Открыть кабинет','https://lk.pmedpharm.ru/'],['📚','Библиотека','Библиотека вуза и бесплатные электронные учебники для студентов.','Открыть библиотеку','https://pmedpharm.ru/departments/nauchnaya_biblioteka_pyatigorskogo_filiala_volggmu/'],['🩺','Медпункт','В общежитии № 2, 5 этаж. Пн–пт 8:30–16:30. Первая медицинская помощь студентам.','Открыть страницу','https://pmedpharm.ru/info_inst/med_punkt/'],['💬','Психологическая помощь','Грустно, тревожно или одиноко? Можно написать психологу вуза: ovz@pmedpharm.ru','Открыть страницу','https://pmedpharm.ru/kabinet-psihologa/']]},

poTitle:{en:'Send and get things',fr:'Envoyer et recevoir',ru:'Отправить и получить'},
poLead:{en:'There are very many pickup points in the city, so we do not show them on the map. Open Yandex Maps, type the name, and you will see the closest one.',fr:'Il y a énormément de points de retrait en ville, donc on ne les montre pas sur la carte. Ouvre Yandex Maps, tape le nom, et tu verras le plus proche.',ru:'Пунктов выдачи в городе очень много, поэтому на карте мы их не показываем. Открой Яндекс Карты, напиши название — и увидишь ближайший.'},
po:{en:[['🛍','Ozon and Wildberries','Two big Russian online shops, like Amazon. Order in the app: clothes, a phone, things for your room, books. It comes in a few days and is often cheaper than in shops. You pick it up at a point near your home. You can pay with a Mir card.'],['✉️','Russian Post (Pochta Rossii)','Send letters and parcels to any city in Russia and to other countries. Your family can also send you a parcel from home: it comes to the post office near you. Take your passport. It is the cheapest way, but not the fastest.'],['📦','CDEK','A private delivery company. Parcels inside Russia usually go faster than by post, and you can follow them in the app. It also sends abroad. A good choice for important things.'],['🚆','By train (at the railway station)','Big things can travel by train: at the railway station there is a baggage office. Good for sending a heavy bag or a box to another city. Ask at the station for the price and the time.']],
fr:[['🛍','Ozon et Wildberries','Deux grands magasins en ligne russes, comme Amazon. Commande dans l’appli : vêtements, téléphone, objets pour ta chambre, livres. Ça arrive en quelques jours et c’est souvent moins cher qu’en magasin. Tu retires dans un point près de chez toi. Tu peux payer avec une carte Mir.'],['✉️','La Poste russe (Pochta Rossii)','Envoie des lettres et des colis dans toute la Russie et à l’étranger. Ta famille peut aussi t’envoyer un colis : il arrive au bureau de poste près de chez toi. Prends ton passeport. C’est le moins cher, mais pas le plus rapide.'],['📦','CDEK','Une société de livraison privée. En Russie, les colis vont en général plus vite que par la poste, et tu peux les suivre dans l’appli. Elle envoie aussi à l’étranger. Un bon choix pour les choses importantes.'],['🚆','Par le train (à la gare)','Les gros objets peuvent voyager en train : à la gare, il y a un service des bagages. Pratique pour envoyer un sac lourd ou un carton dans une autre ville. Demande le prix et le délai à la gare.']],
ru:[['🛍','Ozon и Wildberries','Два больших русских интернет-магазина, как Amazon. Заказывай в приложении: одежду, телефон, вещи для комнаты, книги. Привозят за несколько дней, часто дешевле, чем в магазинах. Забираешь в пункте рядом с домом. Платить можно картой «Мир».'],['✉️','Почта России','Отправляй письма и посылки в любой город России и в другие страны. Семья тоже может прислать тебе посылку из дома: она придёт в отделение рядом с тобой. Возьми паспорт. Это самый дешёвый способ, но не самый быстрый.'],['📦','СДЭК','Частная служба доставки. По России посылки обычно идут быстрее, чем почтой, и их видно в приложении. За границу тоже отправляет. Хороший выбор для важных вещей.'],['🚆','Поездом (на вокзале)','Большие вещи можно отправить поездом: на железнодорожном вокзале есть багажное отделение. Удобно, если нужно отправить тяжёлую сумку или коробку в другой город. Цену и сроки спроси на вокзале.']]},

fiLead:{en:'Something is not clear? Write to us. We answer in English, French, Arabic and Russian.',fr:'Quelque chose n’est pas clair ? Écris-nous. On répond en français, anglais, arabe et russe.',ru:'Что-то непонятно? Напиши нам. Отвечаем на английском, французском, арабском и русском.'},
