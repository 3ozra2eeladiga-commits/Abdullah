fi:{en:[
 ['Keep your migration card safe.','When you land in Russia, at passport control you get a migration card. It is a small paper (or an electronic one). It shows when and why you came. Keep it until you leave Russia. Without it you cannot get registered. If you lose it, tell your university straight away.'],
 ['On day one, go to your university.','Go to the international students office (the migration office) of your university. At PMFI it is in Dorm No. 2, 2nd floor (Kalinina Ave 11), open 8:30–17:00, phone +7 (8793) 32-04-46. They will explain registration and tell you exactly what to do and when. This is the most important step.'],
 ['Get a SIM card and Gosuslugi.','Buy a SIM card (Beeline, MTS, MegaFon) with your passport. Then you must confirm your number on Gosuslugi, the state services website. If you don’t, your number can be blocked. You can confirm your Gosuslugi account at an MFC office (see “MFC & Gosuslugi” on the map). Ask at the university which papers you need. Gosuslugi will also help you with many other things.'],
 ['Get a Russian bank card (Mir).','Visa and Mastercard from your country do not work in Russia. With a Mir card you can pay in shops, order a taxi, food and delivery, and buy online. You can open one at Sberbank near the main building. Take your passport.'],
 ['Install Russian apps.','Google Maps works badly here. Use Yandex Maps or 2GIS: they show buses and trams in real time. Yandex Go is for taxis and delivery, Yandex Eda and Samokat bring food, Yandex Translate reads signs with your camera.'],
 ['Remember your tram stop.','Universam (Универсам). Trams 2, 4, 6, 7 and 8.']],
fr:[
 ['Garde bien ta carte migratoire.','Quand tu arrives en Russie, au contrôle des passeports, on te donne une carte migratoire. C’est un petit papier (ou une version électronique). Elle montre quand et pourquoi tu es venu. Garde-la jusqu’à ton départ de Russie. Sans elle, pas d’enregistrement. Si tu la perds, préviens ton université tout de suite.'],
 ['Le premier jour, va à ton université.','Va au bureau des étudiants étrangers (le service migration) de ton université. Au PMFI, c’est dans la résidence n° 2, 2e étage (av. Kalinine, 11), ouvert de 8 h 30 à 17 h, tél. +7 (8793) 32-04-46. On t’expliquera l’enregistrement et on te dira exactement quoi faire et quand. C’est l’étape la plus importante.'],
 ['Prends une carte SIM et Gosuslugi.','Achète une carte SIM (Beeline, MTS, MegaFon) avec ton passeport. Ensuite, tu dois confirmer ton numéro sur Gosuslugi, le site des services de l’État. Sinon, ton numéro peut être bloqué. Tu peux confirmer ton compte Gosuslugi dans un MFC (voir « MFC et Gosuslugi » sur la carte). Demande à l’université quels papiers il faut. Gosuslugi t’aidera aussi pour beaucoup d’autres choses.'],
 ['Prends une carte bancaire russe (Mir).','Les cartes Visa et Mastercard de ton pays ne marchent pas en Russie. Avec une carte Mir, tu peux payer dans les magasins, commander un taxi, des repas, des livraisons et acheter en ligne. Tu peux l’ouvrir à la Sberbank près du bâtiment principal. Prends ton passeport.'],
 ['Installe les applis russes.','Google Maps marche mal ici. Utilise Yandex Maps ou 2GIS : ils montrent les bus et les trams en direct. Yandex Go pour le taxi et la livraison, Yandex Eda et Samokat pour les repas, Yandex Translate pour lire les panneaux avec la caméra.'],
 ['Retiens ton arrêt de tram.','Universam (Универсам). Trams 2, 4, 6, 7 et 8.']],
ru:[
 ['Береги миграционную карту.','Когда прилетаешь в Россию, на паспортном контроле дают миграционную карту — небольшой бланк (или электронную). В ней видно, когда и зачем ты приехал. Храни её до отъезда из России. Без неё не сделают регистрацию. Если потерял — сразу скажи в вузе.'],
 ['В первый же день иди в свой вуз.','Иди в отдел по работе с иностранными студентами (миграционный отдел) своего вуза. В ПМФИ он в общежитии № 2, 2 этаж (пр. Калинина, 11), работает 8:30–17:00, тел. +7 (8793) 32-04-46. Там объяснят про регистрацию и скажут, что и когда делать. Это самый важный шаг.'],
 ['Купи SIM-карту и сделай Госуслуги.','Купи SIM-карту (Билайн, МТС, МегаФон) по паспорту. Потом номер обязательно нужно подтвердить на Госуслугах — это сайт государственных услуг. Иначе номер могут заблокировать. Подтвердить учётную запись Госуслуг можно в МФЦ (смотри «МФЦ и Госуслуги» на карте). Какие документы нужны — спроси в вузе. Госуслуги помогут и во многом другом.'],
 ['Сделай русскую банковскую карту «Мир».','Visa и Mastercard твоей страны в России не работают. С картой «Мир» можно платить в магазинах, заказывать такси, еду и доставку, покупать в интернете. Открыть её можно в Сбербанке у главного корпуса. Возьми паспорт.'],
 ['Поставь русские приложения.','Google Карты здесь работают плохо. Ставь Яндекс Карты или 2ГИС: там видно автобусы и трамваи в реальном времени. Яндекс Go — такси и доставка, Яндекс Еда и Самокат — еда, Яндекс Переводчик — читать вывески камерой.'],
 ['Запомни свою остановку.','«Универсам». Трамваи 2, 4, 6, 7 и 8.']]},
foot:{en:'A student city guide. Not the official website of the university.',fr:'Un guide de la ville pour étudiants. Ce n’est pas le site officiel de l’université.',ru:'Гид по городу для студентов. Это не официальный сайт института.'}
};
const SOS = {
 en:{t:'Help and the law',lead:'Save this page. If something bad happens, call 112. It is free. It works even with no SIM card and no money on the phone.',
  nums:[['112','All emergencies'],['103','Ambulance'],['102','Police'],['101','Fire and rescue (MChS)'],['104','Gas leak']],
  call:['📞','What to say on the phone',['What happened.','The address: street, building, entrance, floor.','Your name and phone number.','Don’t hang up first.']],say:'Say in Russian:',tr:'Mne nuzhna pomoshch. Ya inostrannyy student. Adres: …',
  cards:[['🪪','Always carry your documents',['Passport','Migration card','Medical insurance policy','Registration paper: carry a copy, keep the original at home'],'Keep photos of all of them on your phone too.'],
   ['👮','If the police stop you',['Don’t worry. The police are here to keep you safe. This is their normal work.','Stay calm and polite.','Show your documents.','You can ask the officer’s name and rank.','Don’t sign anything you don’t understand. You have the right to an interpreter.','Call your university straight away. Any question, any problem: call the university.']],
   ['⛔','Strictly forbidden',['Drugs. Any kind. You can go to prison and be sent home forever.','Drinking alcohol in the street or in parks: you pay a fine.','Smoking at bus and tram stops, near playgrounds and inside buildings: you pay a fine.','Working without a work permit: a fine, and you can be sent out of Russia. Ask the university how to work legally.','Going to protests that are not allowed: a fine, and you can be sent out of Russia.','Living without registration, or not at your registered address: a fine and visa problems.','Taking photos of army or police buildings.'],'',1],
   ['📝','Registration',['By law you must be registered within 7 working days after you arrive. The university may ask for it sooner, so ask them.','New address means new registration.','Careful with hotels! If you stay in a hotel, even for one night, the hotel registers you at its address and your old registration changes. After a hotel, go to your university straight away. Better: tell the university before you go.','Watch the end dates of your visa and registration. Renew early, so you have no problems.']],
   ['🧾','Lost your passport or got robbed',['Tell the police (102) and keep the paper they give you.','Tell your university.','Contact the embassy or consulate of your country.']],
   ['🩺','Health',['Medical insurance is a must for every foreign student. Carry your policy with you.']]],
  inst:'PMFI office for foreign students: +7 (8793) 32-04-46 (Dorm No. 2, 2nd floor, 8:30–17:00)',note:'A short reminder, not legal advice. Rules change, so always check with the institute.'},
 fr:{t:'Urgences et loi',lead:'Garde cette page. Si quelque chose de grave arrive, appelle le 112. C’est gratuit. Ça marche même sans carte SIM et sans crédit.',
  nums:[['112','Toutes les urgences'],['103','Ambulance'],['102','Police'],['101','Pompiers et secours (MTchS)'],['104','Fuite de gaz']],
  call:['📞','Que dire au téléphone',['Ce qui s’est passé.','L’adresse : rue, numéro, entrée, étage.','Votre nom et votre numéro de téléphone.','Ne raccrochez pas le premier.']],say:'Dites en russe :',tr:'Mne noujna pomochtch. Ia inostranny student. Adres : …',
  cards:[['🪪','Garde toujours tes documents sur toi',['Passeport','Carte migratoire','Attestation d’assurance maladie','Papier d’enregistrement : une copie sur toi, l’original à la maison'],'Garde aussi des photos de tout dans ton téléphone.'],
   ['👮','Si la police t’arrête',['Ne t’inquiète pas. La police est là pour ta sécurité. C’est son travail normal.','Reste calme et poli.','Montre tes documents.','Tu peux demander le nom et le grade de l’agent.','Ne signe rien que tu ne comprends pas. Tu as droit à un interprète.','Appelle ton université tout de suite. Une question, un problème : appelle l’université.']],
   ['⛔','Strictement interdit',['La drogue. Toutes les drogues. Tu peux aller en prison et être renvoyé chez toi pour toujours.','Boire de l’alcool dans la rue ou dans les parcs : amende.','Fumer aux arrêts de bus et de tram, près des aires de jeux et dans les bâtiments : amende.','Travailler sans permis de travail : amende, et tu peux être renvoyé de Russie. Demande à l’université comment travailler légalement.','Aller à des manifestations non autorisées : amende, et tu peux être renvoyé de Russie.','Vivre sans enregistrement, ou pas à ton adresse enregistrée : amende et problèmes de visa.','Prendre en photo des bâtiments de l’armée ou de la police.'],'',1],
   ['📝','Enregistrement',['La loi dit : tu dois être enregistré dans les 7 jours ouvrables après ton arrivée. L’université peut le demander plus tôt : demande-lui.','Nouvelle adresse, nouvel enregistrement.','Attention aux hôtels ! Si tu dors à l’hôtel, même une nuit, l’hôtel t’enregistre à son adresse et ton ancien enregistrement change. Après l’hôtel, va tout de suite à ton université. Mieux : préviens l’université avant.','Surveille la date de fin de ton visa et de ton enregistrement. Renouvelle à l’avance, pour ne pas avoir de problèmes.']],
   ['🧾','Passeport perdu ou vol',['Préviens la police (102) et garde le papier qu’on te donne.','Préviens ton université.','Contacte l’ambassade ou le consulat de ton pays.']],
   ['🩺','Santé',['L’assurance maladie est obligatoire pour chaque étudiant étranger. Garde ton attestation sur toi.']]],
  inst:'PMFI, bureau des étudiants étrangers : +7 (8793) 32-04-46 (résidence n° 2, 2e étage, 8 h 30–17 h)',note:'Un simple aide-mémoire, pas un conseil juridique. Les règles changent : vérifiez toujours auprès de l’institut.'},
 ru:{t:'Экстренная помощь и закон',lead:'Сохрани эту страницу. Если случилось что-то плохое, звони 112. Это бесплатно. Работает даже без SIM-карты и без денег на телефоне.',
  nums:[['112','Единый номер, все службы'],['103','Скорая помощь'],['102','Полиция'],['101','Пожарные и МЧС'],['104','Утечка газа']],
  call:['📞','Что сказать по телефону',['Что случилось.','Адрес: улица, дом, подъезд, этаж.','Ваше имя и номер телефона.','Не кладите трубку первым.']],say:'Скажите:',tr:'',
  cards:[['🪪','Документы всегда с собой',['Паспорт','Миграционная карта','Полис медицинской страховки','Регистрация (отрывной талон): с собой носи копию, оригинал храни дома'],'И держи фото всех документов в телефоне.'],
