<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#141210;font-family:-apple-system,"SF Pro Display",Inter,Arial,sans-serif;color:#f5f5f7;padding:30px}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
.c{border-radius:26px;padding:26px 22px;background:rgba(58,58,62,.5);border:1px solid rgba(255,255,255,.14)}
.c.light{background:#f4f4f2;color:#111}
.n{font-size:15px;font-weight:600;opacity:.6;margin-bottom:16px}
.big{width:120px;height:120px;display:block;margin:0 auto 22px;filter:drop-shadow(0 12px 28px rgba(0,0,0,.35))}
.lock{display:flex;align-items:center;gap:10px;justify-content:center}
.lock img{width:38px;height:38px}
.w{font-weight:800;font-size:26px;letter-spacing:.06em}.w span{opacity:.5}
.d{font-size:13.5px;opacity:.7;margin-top:14px;text-align:center;line-height:1.4}
</style></head><body>
<div class="row" id="dark"></div><div style="height:22px"></div><div class="row" id="light"></div>
<script>
const v=[['1','Кадр видоискателя + V','Уголки как в камере — съёмка; внутри V — VIZKOD'],['2','&lt;/&gt; + объектив','Скобки кода и объектив камеры между ними'],['3','V-галочка + фокус','V как стрелка кода, точка — фокус камеры'],['4','V + / &gt;','Буква V и знаки кода, строгий чёрно-белый']];
for(const id of ['dark','light'])document.getElementById(id).innerHTML=v.map(([n,t,d])=>`<div class="c ${id}"><div class="n">Вариант ${n} · ${t}</div><img class="big" src="v${n}.svg"><div class="lock"><img src="v${n}.svg"><div class="w">VIZ<span>KOD</span></div></div><div class="d">${d}</div></div>`).join('');
</script></body></html>
