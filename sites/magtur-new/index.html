<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>МАГТУР Туры на Кавказ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;800;900&family=JetBrains+Mono:wght@600&display=swap">
<style>
:root{--bg:#07121a;--fg:#fff;--mist:rgba(255,255,255,.72);--line:rgba(255,255,255,.55)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07121a}}
:root[data-theme="dark"]{--bg:#07121a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:Onest,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.hero{position:relative;height:100vh;height:100svh;min-height:560px;overflow:hidden}
.lay{position:absolute;inset:-3%;width:106%;height:106%;will-change:transform}
.lay img{width:100%;height:100%;object-fit:cover;object-position:center;display:block}
.bg img{filter:saturate(1.05) brightness(.92)}
.peak{-webkit-mask-image:linear-gradient(90deg,transparent 30%,#000 38%,#000 84%,transparent 92%);mask-image:linear-gradient(90deg,transparent 30%,#000 38%,#000 84%,transparent 92%)}
.word{position:absolute;left:0;right:0;top:15.5%;text-align:center;font-weight:900;font-size:22.5vw;line-height:.82;letter-spacing:-.045em;color:#f4f7fa;white-space:nowrap;will-change:transform;
  text-shadow:0 10px 60px rgba(0,0,0,.25)}
.word span{display:inline-block;transform:translateY(60%);opacity:0;animation:rise 1.6s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{to{transform:none;opacity:1}}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,18,26,.45) 0%,transparent 22%,transparent 55%,rgba(7,18,26,.75) 100%);pointer-events:none}
.corner{position:absolute;width:56px;height:56px;border:0 solid var(--line);pointer-events:none}
.c1{left:24px;top:24px;border-left-width:1.5px;border-top-width:1.5px}.c2{right:24px;top:24px;border-right-width:1.5px;border-top-width:1.5px}
.c3{left:24px;bottom:24px;border-left-width:1.5px;border-bottom-width:1.5px}.c4{right:24px;bottom:24px;border-right-width:1.5px;border-bottom-width:1.5px}
.top{position:absolute;left:48px;right:48px;top:40px;display:flex;justify-content:space-between;align-items:center;z-index:3}
.logo{font:600 .78rem/1 "JetBrains Mono",monospace;letter-spacing:.32em}
.nav{display:flex;gap:28px;font:500 .9rem/1 Onest}
.nav a{color:var(--fg);text-decoration:none;opacity:.85}
.info{position:absolute;left:48px;bottom:64px;z-index:3;display:grid;gap:22px;max-width:520px;opacity:0;animation:fade 1s .9s forwards}
.info p{margin:0;font-size:clamp(1.05rem,1.4vw,1.3rem);line-height:1.45;color:var(--mist)}
.cta{display:flex;gap:12px}
.btn{display:inline-flex;align-items:center;gap:10px;border:1.5px solid var(--line);color:#fff;text-decoration:none;font:600 .95rem/1 Onest;padding:16px 24px;border-radius:2px;background:rgba(255,255,255,.04);backdrop-filter:blur(4px);transition:background .3s,color .3s}
.btn:hover{background:#fff;color:#07121a}
.btn.sq{padding:16px}
.btn svg{width:18px;height:18px;fill:currentColor}
.dots{position:absolute;right:48px;top:50%;transform:translateY(-50%);display:grid;gap:14px;z-index:3}
.dots i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line)}
.dots i.on{background:#fff;border-color:#fff}
.soc{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);display:flex;gap:22px;z-index:3;opacity:0;animation:fade 1s 1.1s forwards}
.soc a{color:#fff;opacity:.75;font:600 .64rem/1 "JetBrains Mono",monospace;letter-spacing:.18em;text-decoration:none}
.alt{position:absolute;right:48px;bottom:64px;z-index:3;text-align:right;font:600 .64rem/1.6 "JetBrains Mono",monospace;letter-spacing:.18em;color:var(--mist);opacity:0;animation:fade 1s 1.2s forwards}
.alt b{display:block;font:800 1.6rem/1 Onest;letter-spacing:-.02em;color:#fff}
@keyframes fade{to{opacity:1}}
@media(max-width:760px){
 .word{top:32.5%;font-size:21vw}
 .peak{-webkit-mask-image:linear-gradient(90deg,transparent 18%,#000 30%,#000 92%,transparent 100%);mask-image:linear-gradient(90deg,transparent 18%,#000 30%,#000 92%,transparent 100%)}
 .top{left:22px;right:22px;top:calc(env(safe-area-inset-top,0px) + 26px)}.nav{display:none}
 .corner{width:36px;height:36px}.c1,.c3{left:12px}.c2,.c4{right:12px}.c1,.c2{top:calc(env(safe-area-inset-top,0px) + 12px)}.c3,.c4{bottom:12px}
 .info{left:22px;right:22px;bottom:92px;gap:18px}
 .dots{right:20px}
 .alt{display:none}
 .soc{bottom:40px}}
</style>
</head>
<body>
<section class="hero" id="hero">
  <div class="lay bg" id="lBg"><picture><source media="(max-width:760px)" srcset="img/hero_v.jpg"><img src="img/hero_h.jpg" alt="Эльбрус на закате"></picture></div>
  <div class="word" id="word" aria-label="МАГТУР"><span>МАГТУР</span></div>
  <div class="lay peak" id="lPk"><picture><source media="(max-width:760px)" srcset="img/hero_v_peak.webp"><img src="img/hero_h_peak.webp" alt=""></picture></div>
  <div class="shade"></div>
  <i class="corner c1"></i><i class="corner c2"></i><i class="corner c3"></i><i class="corner c4"></i>
  <div class="top"><span class="logo">МАГТУР</span><nav class="nav"><a href="#">Направления</a><a href="#">Туры</a><a href="#">Гиды</a><a href="#">Контакты</a></nav></div>
  <div class="info">
    <p>Авторские туры по Кавказу.<br>Впечатления на всю жизнь.</p>
    <div class="cta"><a class="btn" href="#">Выбрать тур</a><a class="btn sq" href="#" aria-label="Написать в Telegram"><svg viewBox="0 0 24 24"><path d="M21.5 4.5 2.9 11.7c-1 .4-1 1.8.1 2.1l4.6 1.5 1.8 5.5c.3.8 1.3 1 1.9.4l2.6-2.5 4.7 3.4c.7.5 1.6.1 1.8-.7l3.2-15.2c.2-1-.8-1.8-1.7-1.4Zm-4.3 4-7.6 6.9-.3 3.2-1.4-4.3 8.9-5.6c.4-.2.7.2.4.5Z"/></svg></a></div>
  </div>
  <div class="dots"><i class="on"></i><i></i><i></i></div>
  <div class="alt">Эльбрус<b>5 642 м</b>высшая точка Европы</div>
  <div class="soc"><a href="#">TELEGRAM</a><a href="#">VK</a><a href="#">YOUTUBE</a></div>
</section>
<script>
const bg=document.getElementById('lBg'),pk=document.getElementById('lPk'),wd=document.getElementById('word');
let tx=0,ty=0,cx=0,cy=0;
addEventListener('pointermove',e=>{tx=e.clientX/innerWidth-.5;ty=e.clientY/innerHeight-.5});
(function loop(){cx+=(tx-cx)*.05;cy+=(ty-cy)*.05;const s=scrollY/innerHeight;
 bg.style.transform=`translate3d(${cx*-10}px,${cy*-8+s*40}px,0)`;
 wd.style.transform=`translate3d(${cx*-22}px,${cy*-14+s*90}px,0)`;
 pk.style.transform=`translate3d(${cx*-10}px,${cy*-8+s*40}px,0)`;
 requestAnimationFrame(loop)})();
</script>
</body>
</html>
